<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Road Rush</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#111;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.game{
  position:relative;
  width:min(94vw,420px);
  height:min(94vh,760px);
  aspect-ratio:420/760;
  background:#217a32;
  overflow:hidden;
  border-radius:18px;
  box-shadow:0 0 25px rgba(0,0,0,.7);
}

canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}


/* =========================
   HUD
========================= */

.hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  z-index:10;

  display:flex;
  justify-content:space-between;
  gap:5px;

  pointer-events:none;
}

.hudBox{
  min-width:65px;
  padding:5px 7px;

  background:rgba(0,0,0,.72);
  color:white;

  border-radius:8px;

  text-align:center;

  font-size:11px;
  font-weight:bold;

  border:1px solid rgba(255,255,255,.25);
}

.hudBox span{
  display:block;
  margin-top:2px;
  font-size:15px;
}

.fuelBox{
  min-width:100px;
}

.fuelBar{
  width:80px;
  height:11px;

  margin:4px auto 2px;

  background:#333;

  border:1px solid #aaa;

  border-radius:8px;

  overflow:hidden;
}

#fuelFill{
  width:100%;
  height:100%;

  background:#35d04f;

  border-radius:7px;

  transition:
    width .2s linear,
    background .2s linear;
}

#fuel{
  font-size:12px;
}


/* =========================
   OVERLAY
========================= */

.overlay{
  position:absolute;
  inset:0;

  z-index:20;

  display:flex;
  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.58);

  padding:20px;
}

.panel{
  width:90%;
  max-width:330px;

  padding:25px 18px;

  background:
    linear-gradient(
      180deg,
      #252525,
      #111
    );

  color:white;

  text-align:center;

  border-radius:18px;

  border:1px solid
    rgba(255,255,255,.25);

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.5);
}

.panel h1{
  margin:0 0 8px;
  font-size:32px;
}

.panel p{
  margin:8px 0 15px;

  line-height:1.5;

  color:#ddd;
}


/* =========================
   MAIN BUTTON
========================= */

#mainBtn{
  width:100%;

  padding:13px;

  border:0;
  border-radius:10px;

  background:#00bfff;
  color:white;

  font-size:18px;
  font-weight:bold;

  cursor:pointer;

  touch-action:manipulation;
}

#mainBtn:active{
  transform:scale(.97);
}


/* =========================
   CONTROLS INFO
========================= */

.help{
  margin-top:12px;

  font-size:12px;

  color:#bbb;
}


/* =========================
   MOBILE BUTTONS
========================= */

.controls{
  position:absolute;

  left:0;
  right:0;
  bottom:15px;

  z-index:15;

  display:flex;
  justify-content:space-between;

  padding:0 18px;

  pointer-events:none;
}

.arrow{
  width:68px;
  height:58px;

  border:0;
  border-radius:15px;

  background:
    rgba(0,0,0,.62);

  color:white;

  font-size:30px;
  font-weight:bold;

  pointer-events:auto;

  touch-action:manipulation;

  user-select:none;
  -webkit-user-select:none;
}

.arrow:active{
  transform:scale(.92);

  background:
    rgba(0,0,0,.85);
}


/* =========================
   PAUSE
========================= */

.pauseText{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  z-index:5;

  pointer-events:none;
}


/* =========================
   SMALL SCREEN
========================= */

@media(max-height:650px){

  .controls{
    bottom:8px;
  }

  .arrow{
    width:58px;
    height:48px;
    font-size:25px;
  }

  .panel{
    padding:18px;
  }

  .panel h1{
    font-size:27px;
  }
}

</style>

</head>


<body>


<div class="game" id="gameBox">


<canvas
  id="gameCanvas"
  width="420"
  height="760">
</canvas>


<!-- =========================
     HUD
========================= -->

<div class="hud">

  <div class="hudBox">

    SCORE

    <span id="score">
      0
    </span>

  </div>


  <div class="hudBox">

    COINS

    <span id="coins">
      0
    </span>

  </div>


  <div class="hudBox">

    LIVES

    <span id="lives">
      ❤️ 3
    </span>

  </div>


  <div class="hudBox fuelBox">

    FUEL

    <div class="fuelBar">

      <div id="fuelFill"></div>

    </div>

    <span id="fuel">
      100%
    </span>

  </div>

</div>


<!-- =========================
     START / PAUSE / GAME OVER
========================= -->

<div class="overlay" id="overlay">

  <div class="panel">

    <h1 id="title">
      ROAD RUSH
    </h1>

    <p id="message">
      Avoid traffic, collect coins
      and fuel packs!
    </p>

    <button id="mainBtn">
      Start Game
    </button>

    <div class="help" id="help">

      Use ◀ and ▶ to move<br>
      Tap center of game to pause

    </div>

  </div>

</div>


<!-- =========================
     MOBILE CONTROLS
========================= -->

<div class="controls">

  <button
    class="arrow"
    id="leftBtn">
    ◀
  </button>

  <button
    class="arrow"
    id="rightBtn">
    ▶
  </button>

</div>


<script>


/* =====================================================
   BASIC SETUP
===================================================== */

const canvas =
  document.getElementById(
    "gameCanvas"
  );

const ctx =
  canvas.getContext("2d");


/* =====================================================
   HUD
===================================================== */

const scoreEl =
  document.getElementById("score");

const coinsEl =
  document.getElementById("coins");

const livesEl =
  document.getElementById("lives");

const fuelEl =
  document.getElementById("fuel");

const fuelFill =
  document.getElementById("fuelFill");


/* =====================================================
   UI
===================================================== */

const gameBox =
  document.getElementById(
    "gameBox"
  );

const overlay =
  document.getElementById(
    "overlay"
  );

const title =
  document.getElementById(
    "title"
  );

const message =
  document.getElementById(
    "message"
  );

const mainBtn =
  document.getElementById(
    "mainBtn"
  );

const help =
  document.getElementById(
    "help"
  );

const leftBtn =
  document.getElementById(
    "leftBtn"
  );

const rightBtn =
  document.getElementById(
    "rightBtn"
  );


/* =====================================================
   AUDIO
===================================================== */

let audioContext=null;


function initAudio(){

  if(!audioContext){

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(AudioCtx){

      audioContext =
        new AudioCtx();
    }
  }

  if(
    audioContext &&
    audioContext.state==="suspended"
  ){

    audioContext.resume();
  }
}


function beep(
  frequency,
  duration,
  type="sine",
  volume=.06
){

  if(!audioContext)
    return;

  try{

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.type=type;

    oscillator.frequency.value=
      frequency;


    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime+
      duration
    );


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime+
      duration
    );

  }catch(error){}
}


function coinSound(){

  beep(
    880,
    .08,
    "square",
    .05
  );

  setTimeout(
    function(){

      beep(
        1200,
        .08,
        "square",
        .04
      );

    },
    60
  );
}


function fuelSound(){

  beep(
    500,
    .12,
    "sine",
    .06
  );

  setTimeout(
    function(){

      beep(
        750,
        .12,
        "sine",
        .05
      );

    },
    80
  );
}


function slowSound(){

  beep(
    250,
    .25,
    "triangle",
    .06
  );
}


function crashSound(){

  beep(
    90,
    .3,
    "sawtooth",
    .08
  );
}


function pauseSound(){

  beep(
    350,
    .08,
    "sine",
    .04
  );
}


function resumeSound(){

  beep(
    600,
    .08,
    "sine",
    .04
  );
}


/* =====================================================
   ROAD
===================================================== */

const road={

  x:35,

  width:350,

  lanes:3,

  lanesX:[],

  offset:0

};


function buildRoad(){

  road.lanesX=[];

  const laneWidth =
    road.width/
    road.lanes;


  for(
    let i=0;
    i<road.lanes;
    i++
  ){

    road.lanesX.push(

      road.x+
      laneWidth*i+
      laneWidth/2

    );
  }
}


/* =====================================================
   PLAYER
===================================================== */

const player={

  lane:1,

  x:210,

  y:650,

  width:46,

  height:78

};


/* =====================================================
   TRAFFIC TYPES
===================================================== */

const trafficTypes=[

  {
    name:"car",
    w:46,
    h:78,
    speed:180
  },

  {
    name:"taxi",
    w:46,
    h:78,
    speed:165
  },

  {
    name:"truck",
    w:52,
    h:92,
    speed:145
  },

  {
    name:"bus",
    w:58,
    h:110,
    speed:125
  }

];


/* =====================================================
   GAME STATE
===================================================== */

const state={

  running:false,

  paused:false,

  score:0,

  coins:0,

  lives:3,

  fuel:100,

  roadSpeed:180,

  speedMultiplier:1,

  slowTimer:0,

  spawnTimer:1,

  itemTimer:1.5,

  lastTime:0,

  invulnerable:0,

  flash:0,

  cars:[],

  items:[],

  nearMissTimer:0

};


/* =====================================================
   HIGH SCORE
===================================================== */

let highScore=0;

try{

  highScore=
    Number(
      localStorage.getItem(
        "roadRushHighScore"
      )
    )||0;

}catch(error){

  highScore=0;
}


/* =====================================================
   HUD UPDATE
===================================================== */

function updateHUD(){

  if(
    !Number.isFinite(
      state.score
    )
  ){

    state.score=0;
  }


  if(
    !Number.isFinite(
      state.coins
    )
  ){

    state.coins=0;
  }


  if(
    !Number.isFinite(
      state.fuel
    )
  ){

    state.fuel=100;
  }


  scoreEl.textContent=
    Math.floor(
      state.score
    );


  coinsEl.textContent=
    state.coins;


  livesEl.textContent=
    "❤️ "+
    state.lives;


  const fuelPercent=
    Math.max(
      0,
      Math.min(
        100,
        state.fuel
      )
    );


  fuelEl.textContent=
    Math.floor(
      fuelPercent
    )+"%";


  fuelFill.style.width=
    fuelPercent+"%";


  if(fuelPercent>50){

    fuelFill.style.background=
      "#35d04f";

  }else if(fuelPercent>25){

    fuelFill.style.background=
      "#ffd21f";

  }else{

    fuelFill.style.background=
      "#ff3333";
  }
}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

  state.running=false;

  state.paused=false;

  state.score=0;

  state.coins=0;

  state.lives=3;

  state.fuel=100;

  state.roadSpeed=180;

  state.speedMultiplier=1;

  state.slowTimer=0;

  state.spawnTimer=.9;

  state.itemTimer=1.5;

  state.lastTime=0;

  state.invulnerable=0;

  state.flash=0;

  state.cars=[];

  state.items=[];

  state.nearMissTimer=0;


  player.lane=1;

  player.x=
    road.lanesX[1];

  player.y=650;


  road.offset=0;


  updateHUD();
}


/* =====================================================
   START
===================================================== */

function startGame(){

  initAudio();

  resetGame();

  state.running=true;

  state.lastTime=
    performance.now();

  title.textContent=
    "ROAD RUSH";

  message.innerHTML=
    "Avoid traffic, collect coins<br>"+
    "and fuel packs!";

  mainBtn.textContent=
    "Start Game";

  overlay.style.display=
    "none";

  updateHUD();
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  state.running=false;

  state.paused=false;


  const finalScore=
    Math.floor(
      state.score
    );


  if(
    finalScore>highScore
  ){

    highScore=
      finalScore;

    try{

      localStorage.setItem(
        "roadRushHighScore",
        highScore
      );

    }catch(error){}
  }


  title.textContent=
    "GAME OVER";


  message.innerHTML=
    "Score: "+
    finalScore+
    "<br>Coins: "+
    state.coins+
    "<br>Best: "+
    highScore;


  mainBtn.textContent=
    "Play Again";


  overlay.style.display=
    "flex";


  updateHUD();
}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function moveLeft(){

  if(
    !state.running ||
    state.paused
  ){

    return;
  }


  if(player.lane>0){

    player.lane--;

    player.x=
      road.lanesX[
        player.lane
      ];
  }
}


function moveRight(){

  if(
    !state.running ||
    state.paused
  ){

    return;
  }


  if(
    player.lane<
    road.lanes-1
  ){

    player.lane++;

    player.x=
      road.lanesX[
        player.lane
      ];
  }
}


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      e.preventDefault();

      moveLeft();
    }


    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      e.preventDefault();

      moveRight();
    }


    if(
      e.key===" " ||
      e.key.toLowerCase()==="p"
    ){

      e.preventDefault();

      togglePause();
    }

  }
);


/* =====================================================
   MOBILE BUTTONS
===================================================== */

leftBtn.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    initAudio();

    moveLeft();

  },
  {passive:false}
);


rightBtn.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    initAudio();

    moveRight();

  },
  {passive:false}
);


/* =====================================================
   MAIN BUTTON
===================================================== */

mainBtn.addEventListener(
  "click",
  function(){

    if(!state.running){

      startGame();

    }else if(state.paused){

      resumeGame();
    }

  }
);


/* =========================
   END P1
========================= *//* =====================================================
   P2 - PAUSE + SAFE TRAFFIC SYSTEM
===================================================== */


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

  if(!state.running)
    return;


  if(state.paused){

    resumeGame();

  }else{

    pauseGame();
  }
}


function pauseGame(){

  if(
    !state.running ||
    state.paused
  ){

    return;
  }


  initAudio();

  state.paused=true;

  pauseSound();


  title.textContent=
    "PAUSED";


  message.innerHTML=
    "Use ◀ and ▶ to move<br>"+
    "Tap Resume to continue";


  mainBtn.textContent=
    "Resume";


  overlay.style.display=
    "flex";
}


function resumeGame(){

  if(
    !state.running ||
    !state.paused
  ){

    return;
  }


  initAudio();

  state.paused=false;

  state.lastTime=
    performance.now();

  resumeSound();

  overlay.style.display=
    "none";
}


/* =====================================================
   TRAFFIC LANE SYSTEM
===================================================== */

/*
   IMPORTANT:

   The road has 3 lanes.

   We allow traffic to occupy
   ONLY 2 lanes at a time.

   Therefore one complete lane
   is always available to the player.
*/


function getUsedTrafficLanes(){

  const used=[];


  for(
    const car of state.cars
  ){

    if(
      !used.includes(
        car.lane
      )
    ){

      used.push(
        car.lane
      );
    }
  }


  return used;
}


/*
   Returns true if a lane has
   a car anywhere in its useful
   traffic area.
*/

function laneHasTraffic(
  lane
){

  for(
    const car of state.cars
  ){

    if(
      car.lane!==lane
    ){

      continue;
    }


    /*
      Ignore cars that are far
      above the screen.
    */

    if(
      car.y<
      -car.height-100
    ){

      continue;
    }


    /*
      Ignore cars that already
      passed the bottom.
    */

    if(
      car.y>
      canvas.height+100
    ){

      continue;
    }


    return true;
  }


  return false;
}


/*
   Check the distance from a
   new car to existing cars
   in the same lane.
*/

function laneSafeForSpawn(
  lane
){

  for(
    const car of state.cars
  ){

    if(
      car.lane!==lane
    ){

      continue;
    }


    /*
      New cars start above the
      screen.

      Keep enough distance so
      vehicles don't appear
      directly on top of each
      other.
    */

    if(
      car.y<
      220
    ){

      const distance=
        Math.abs(
          car.y+
          car.height
        );


      if(distance<150){

        return false;
      }
    }
  }


  return true;
}


/*
   Check if adding traffic
   to a lane would create
   three blocked lanes.

   It never allows that.
*/

function canUseLane(
  lane
){

  const used=
    getUsedTrafficLanes();


  /*
    This lane already contains
    traffic.

    It is okay to continue
    using the same lane if
    there is enough distance.
  */

  if(
    used.includes(lane)
  ){

    return laneSafeForSpawn(
      lane
    );
  }


  /*
    This is a new traffic lane.

    If 2 lanes are already used,
    we MUST NOT use a third.
  */

  if(
    used.length>=2
  ){

    return false;
  }


  return laneSafeForSpawn(
    lane
  );
}


/*
   Get all lanes that can safely
   receive a new traffic vehicle.
*/

function getSafeSpawnLanes(){

  const lanes=[];


  for(
    let lane=0;
    lane<road.lanes;
    lane++
  ){

    if(
      canUseLane(lane)
    ){

      lanes.push(lane);
    }
  }


  return lanes;
}


/* =====================================================
   VEHICLE SPACING
===================================================== */

function requiredCarGap(
  front,
  back
){

  /*
    Cars are drawn using top-left
    y positions.

    So the minimum distance is
    based on both actual heights.
  */

  return (
    front.height+
    24
  );
}


/*
   Keep cars in the same lane
   separated.
*/

function preventTrafficOverlap(){

  for(
    let lane=0;
    lane<road.lanes;
    lane++
  ){

    const laneCars=
      state.cars
        .filter(
          car =>
            car.lane===lane
        )
        .sort(
          (a,b)=>
            a.y-b.y
        );


    /*
      The first car is the
      vehicle in front.

      Every next car follows it.
    */

    for(
      let i=1;
      i<laneCars.length;
      i++
    ){

      const front=
        laneCars[i-1];

      const back=
        laneCars[i];


      const minGap=
        requiredCarGap(
          front,
          back
        );


      /*
        Prevent physical overlap.
      */

      if(
        back.y<
        front.y+
        minGap
      ){

        back.y=
          front.y+
          minGap;
      }


      /*
        A faster car cannot
        overtake through the
        vehicle in front.
      */

      if(
        back.speed>
        front.speed
      ){

        back.speed=
          front.speed;
      }
    }
  }
}


/* =====================================================
   CREATE TRAFFIC
===================================================== */

function createTraffic(){

  /*
    Get safe lanes.

    Because of the 2-lane rule,
    this will NEVER create a
    third traffic lane.
  */

  const safeLanes=
    getSafeSpawnLanes();


  if(
    safeLanes.length===0
  ){

    return false;
  }


  /*
    Pick one of the safe lanes.
  */

  const lane=
    safeLanes[
      Math.floor(
        Math.random()*
        safeLanes.length
      )
    ];


  /*
    Pick vehicle.
  */

  const type=
    trafficTypes[
      Math.floor(
        Math.random()*
        trafficTypes.length
      )
    ];


  const car={

    type:type.name,

    lane:lane,

    x:
      road.lanesX[lane],

    y:
      -type.h-50,

    width:type.w,

    height:type.h,

    speed:
      type.speed*
      (
        .92+
        Math.random()*.08
      ),

    nearMiss:false

  };


  state.cars.push(car);


  /*
    Final safety check.

    This is an extra protection
    against accidental bad states.
  */

  preventTrafficOverlap();


  return true;
}


/* =====================================================
   SPAWN TRAFFIC
===================================================== */

function spawnCars(dt){

  state.spawnTimer-=dt;


  if(
    state.spawnTimer>0
  ){

    return;
  }


  const difficulty=
    Math.min(
      state.score/2500,
      .25
    );


  const spawned=
    createTraffic();


  if(spawned){

    /*
      Traffic becomes a little
      more frequent with score.
    */

    state.spawnTimer=
      Math.max(
        .70,
        1.18-difficulty
      );

  }else{

    /*
      No safe lane currently.

      Wait briefly and try again.
    */

    state.spawnTimer=.30;
  }
}


/* =====================================================
   UPDATE TRAFFIC
===================================================== */

function updateCars(dt){

  for(
    let i=
      state.cars.length-1;

    i>=0;

    i--
  ){

    const car=
      state.cars[i];


    /*
      Repair invalid values.
    */

    if(
      !Number.isFinite(
        car.y
      )
    ){

      car.y=
        -car.height-50;
    }


    if(
      !Number.isFinite(
        car.speed
      ) ||
      car.speed<=0
    ){

      const type=
        trafficTypes.find(
          t =>
            t.name===
            car.type
        );


      car.speed=
        type
          ? type.speed
          : 150;
    }


    /*
      Move.
    */

    car.y +=
      car.speed*
      state.speedMultiplier*
      dt;


    /* =====================
       NEAR MISS
    ===================== */

    if(
      !car.nearMiss &&

      car.y>
        player.y-35 &&

      car.y<
        player.y+
        player.height+
        35
    ){

      const horizontal=
        Math.abs(
          car.x-
          player.x
        );


      const safeDistance=
        (
          car.width+
          player.width
        )/2;


      if(
        horizontal>
          safeDistance &&

        horizontal<
          safeDistance+25
      ){

        car.nearMiss=true;

        state.score+=15;

        state.nearMissTimer=.7;

        beep(
          1000,
          .08,
          "square",
          .035
        );
      }
    }


    /* =====================
       REMOVE
    ===================== */

    if(
      car.y>
      canvas.height+
      car.height+
      40
    ){

      state.cars.splice(
        i,
        1
      );

      state.score+=5;
    }
  }


  /*
    IMPORTANT:
    after movement, separate
    same-lane traffic again.
  */

  preventTrafficOverlap();
}


/* =====================================================
   COLLISION
===================================================== */

function checkCollisions(){

  if(
    state.invulnerable>0
  ){

    return;
  }


  const playerLeft=
    player.x-
    player.width/2;

  const playerRight=
    player.x+
    player.width/2;

  const playerTop=
    player.y;

  const playerBottom=
    player.y+
    player.height;


  for(
    const car of state.cars
  ){

    const carLeft=
      car.x-
      car.width/2;

    const carRight=
      car.x+
      car.width/2;

    const carTop=
      car.y;

    const carBottom=
      car.y+
      car.height;


    if(

      playerLeft<
      carRight &&

      playerRight>
      carLeft &&

      playerTop<
      carBottom &&

      playerBottom>
      carTop

    ){

      crashPlayer();

      return;
    }
  }
}


/* =====================================================
   PLAYER CRASH
===================================================== */

function crashPlayer(){

  state.lives--;

  state.invulnerable=
    1.5;

  state.flash=
    .35;


  crashSound();


  /*
    Remove nearby traffic.

    This prevents instant repeated
    crashes.
  */

  state.cars=
    state.cars.filter(
      car =>
        Math.abs(
          car.y-
          player.y
        )>180
    );


  /*
    Center player.
  */

  player.lane=1;

  player.x=
    road.lanesX[1];


  if(
    state.lives<=0
  ){

    gameOver();

    return;
  }


  updateHUD();
}


/* =========================
   END P2
========================= *//* =====================================================
   P3 - ITEMS + DRAWING
===================================================== */


/* =====================================================
   ITEMS
===================================================== */

function createItem(){

  const types=[
    "coin",
    "fuel",
    "slow"
  ];


  const type=
    types[
      Math.floor(
        Math.random()*
        types.length
      )
    ];


  const lane=
    Math.floor(
      Math.random()*
      road.lanes
    );


  state.items.push({

    type:type,

    lane:lane,

    x:
      road.lanesX[lane],

    y:-35,

    size:22,

    speed:
      125+
      Math.random()*30

  });
}


/* =====================================================
   SPAWN ITEMS
===================================================== */

function spawnItems(dt){

  state.itemTimer-=dt;


  if(
    state.itemTimer<=0
  ){

    createItem();


    state.itemTimer=
      2+
      Math.random()*2.5;
  }
}


/* =====================================================
   UPDATE ITEMS
===================================================== */

function updateItems(dt){

  for(
    let i=
      state.items.length-1;

    i>=0;

    i--
  ){

    const item=
      state.items[i];


    item.y +=
      item.speed*
      state.speedMultiplier*
      dt;


    /*
      Remove off-screen.
    */

    if(
      item.y>
      canvas.height+50
    ){

      state.items.splice(
        i,
        1
      );

      continue;
    }


    /*
      Player center.
    */

    const playerCenterY=
      player.y+
      player.height/2;


    const dx=
      Math.abs(
        player.x-
        item.x
      );


    const dy=
      Math.abs(
        playerCenterY-
        item.y
      );


    /*
      Collect.
    */

    if(

      dx<
        player.width/2+
        item.size/2 &&

      dy<
        player.height/2+
        item.size/2

    ){

      collectItem(item);


      state.items.splice(
        i,
        1
      );
    }
  }
}


/* =====================================================
   COLLECT ITEM
===================================================== */

function collectItem(item){

  if(
    item.type==="coin"
  ){

    state.coins++;

    state.score+=25;

    coinSound();
  }


  else if(
    item.type==="fuel"
  ){

    state.fuel+=25;


    if(
      state.fuel>100
    ){

      state.fuel=100;
    }


    state.score+=10;

    fuelSound();
  }


  else if(
    item.type==="slow"
  ){

    state.speedMultiplier=
      .55;

    state.slowTimer=
      5;

    state.score+=15;

    slowSound();
  }


  updateHUD();
}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(){

  if(
    road.lanesX.length!==3
  ){

    buildRoad();
  }


  if(
    player.lane<0
  ){

    player.lane=0;
  }


  if(
    player.lane>
    road.lanes-1
  ){

    player.lane=
      road.lanes-1;
  }


  player.x=
    road.lanesX[
      player.lane
    ];
}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

  /*
    Grass.
  */

  ctx.fillStyle=
    "#217a32";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Grass details.
  */

  ctx.fillStyle=
    "#1d6d2c";


  for(
    let y=-20;
    y<canvas.height;
    y+=55
  ){

    ctx.fillRect(
      8,
      y+
      road.offset*.2,
      10,
      3
    );


    ctx.fillRect(
      canvas.width-18,
      y+
      20+
      road.offset*.2,
      10,
      3
    );
  }


  /*
    Road.
  */

  ctx.fillStyle=
    "#303030";

  ctx.fillRect(
    road.x,
    0,
    road.width,
    canvas.height
  );


  /*
    Road edges.
  */

  ctx.fillStyle=
    "#eeeeee";


  ctx.fillRect(
    road.x,
    0,
    5,
    canvas.height
  );


  ctx.fillRect(
    road.x+
    road.width-
    5,
    0,
    5,
    canvas.height
  );


  /*
    Lane lines.
  */

  ctx.fillStyle=
    "#ffffff";


  const dashHeight=45;

  const gap=35;

  const total=
    dashHeight+
    gap;


  for(
    let lane=1;
    lane<road.lanes;
    lane++
  ){

    const x=
      road.x+
      (
        road.width/
        road.lanes
      )*
      lane;


    for(
      let y=
        -dashHeight+
        road.offset;

      y<canvas.height;

      y+=total
    ){

      ctx.fillRect(
        x-3,
        y,
        6,
        dashHeight
      );
    }
  }
}


/* =====================================================
   DRAW TRAFFIC CAR
===================================================== */

function drawCar(car){

  const x=
    car.x;

  const y=
    car.y;

  const w=
    car.width;

  const h=
    car.height;


  ctx.save();


  ctx.translate(
    x,
    y
  );


  /*
    Body colour.
  */

  if(
    car.type==="taxi"
  ){

    ctx.fillStyle=
      "#f4c542";

  }

  else if(
    car.type==="truck"
  ){

    ctx.fillStyle=
      "#3d7eff";

  }

  else if(
    car.type==="bus"
  ){

    ctx.fillStyle=
      "#e65b5b";

  }

  else{

    ctx.fillStyle=
      "#e53935";
  }


  /*
    Main body.
  */

  ctx.fillRect(
    -w/2,
    0,
    w,
    h
  );


  /*
    Windows.
  */

  ctx.fillStyle=
    "#b9e6ff";


  if(
    car.type==="bus"
  ){

    ctx.fillRect(
      -w/2+6,
      8,
      w-12,
      18
    );


    ctx.fillRect(
      -w/2+6,
      32,
      w-12,
      18
    );


    if(
      h>70
    ){

      ctx.fillRect(
        -w/2+6,
        56,
        w-12,
        18
      );
    }

  }else{

    ctx.fillRect(
      -w/2+7,
      10,
      w-14,
      22
    );
  }


  /*
    Wheels.
  */

  ctx.fillStyle=
    "#111";


  ctx.fillRect(
    -w/2-3,
    12,
    6,
    18
  );


  ctx.fillRect(
    w/2-3,
    12,
    6,
    18
  );


  ctx.fillRect(
    -w/2-3,
    h-30,
    6,
    18
  );


  ctx.fillRect(
    w/2-3,
    h-30,
    6,
    18
  );


  /*
    Headlights.
  */

  ctx.fillStyle=
    "#fff6a0";


  ctx.fillRect(
    -w/2+5,
    2,
    8,
    5
  );


  ctx.fillRect(
    w/2-13,
    2,
    8,
    5
  );


  /*
    Truck detail.
  */

  if(
    car.type==="truck"
  ){

    ctx.strokeStyle=
      "#ffffff";

    ctx.lineWidth=2;

    ctx.strokeRect(
      -w/2+5,
      h-48,
      w-10,
      20
    );
  }


  /*
    Bus detail.
  */

  if(
    car.type==="bus"
  ){

    ctx.fillStyle=
      "rgba(255,255,255,.35)";

    ctx.fillRect(
      -w/2+5,
      h-25,
      w-10,
      4
    );
  }


  ctx.restore();
}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

  ctx.save();


  ctx.translate(
    player.x,
    player.y
  );


  /*
    Crash flashing.
  */

  if(
    state.invulnerable>0 &&
    Math.floor(
      state.invulnerable*10
    )%2===0
  ){

    ctx.globalAlpha=
      .35;
  }


  /*
    Player body.
  */

  ctx.fillStyle=
    "#00bfff";

  ctx.fillRect(
    -player.width/2,
    0,
    player.width,
    player.height
  );


  /*
    Roof.
  */

  ctx.fillStyle=
    "#0b4f8a";

  ctx.fillRect(
    -16,
    13,
    32,
    32
  );


  /*
    Window.
  */

  ctx.fillStyle=
    "#bdeaff";

  ctx.fillRect(
    -13,
    17,
    26,
    18
  );


  /*
    Wheels.
  */

  ctx.fillStyle=
    "#111";


  ctx.fillRect(
    -player.width/2-3,
    12,
    6,
    20
  );


  ctx.fillRect(
    player.width/2-3,
    12,
    6,
    20
  );


  ctx.fillRect(
    -player.width/2-3,
    player.height-32,
    6,
    20
  );


  ctx.fillRect(
    player.width/2-3,
    player.height-32,
    6,
    20
  );


  /*
    Headlights.
  */

  ctx.fillStyle=
    "#ffffaa";


  ctx.fillRect(
    -15,
    2,
    9,
    6
  );


  ctx.fillRect(
    6,
    2,
    9,
    6
  );


  /*
    Center stripe.
  */

  ctx.fillStyle=
    "rgba(255,255,255,.25)";


  ctx.fillRect(
    -2,
    46,
    4,
    25
  );


  ctx.restore();
}


/* =====================================================
   DRAW ITEMS
===================================================== */

function drawItem(item){

  ctx.save();


  ctx.translate(
    item.x,
    item.y
  );


  /*
    COIN
  */

  if(
    item.type==="coin"
  ){

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      item.size/2,
      0,
      Math.PI*2
    );


    ctx.fillStyle=
      "#ffd700";

    ctx.fill();


    ctx.strokeStyle=
      "#fff2a0";

    ctx.lineWidth=3;

    ctx.stroke();


    ctx.fillStyle=
      "#9b6b00";

    ctx.font=
      "bold 15px Arial";

    ctx.textAlign=
      "center";

    ctx.textBaseline=
      "middle";

    ctx.fillText(
      "$",
      0,
      1
    );
  }


  /*
    FUEL
  */

  else if(
    item.type==="fuel"
  ){

    ctx.fillStyle=
      "#ff7b00";


    ctx.fillRect(
      -10,
      -14,
      20,
      28
    );


    ctx.fillStyle=
      "#ffffff";


    ctx.fillRect(
      -6,
      -8,
      12,
      10
    );


    ctx.fillStyle=
      "#ff3333";


    ctx.fillRect(
      10,
      -8,
      8,
      5
    );
  }


  /*
    SPEED REDUCER
  */

  else if(
    item.type==="slow"
  ){

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      14,
      0,
      Math.PI*2
    );


    ctx.fillStyle=
      "#9b59ff";

    ctx.fill();


    ctx.strokeStyle=
      "#ffffff";

    ctx.lineWidth=2;

    ctx.stroke();


    ctx.fillStyle=
      "#ffffff";

    ctx.font=
      "bold 13px Arial";

    ctx.textAlign=
      "center";

    ctx.textBaseline=
      "middle";

    ctx.fillText(
      "S",
      0,
      1
    );
  }


  ctx.restore();
}


/* =====================================================
   DRAW TRAFFIC + ITEMS
===================================================== */

function drawTraffic(){

  for(
    const car of state.cars
  ){

    drawCar(car);
  }
}


function drawItems(){

  for(
    const item of state.items
  ){

    drawItem(item);
  }
}


/* =========================
   END P3
========================= *//* =====================================================
   P4 - GAME LOOP + PAUSE + FINAL SETUP
===================================================== */


/* =====================================================
   CENTER TAP = PAUSE
===================================================== */

canvas.addEventListener(
  "pointerdown",
  function(e){

    if(
      !state.running ||
      state.paused
    ){

      return;
    }


    const rect=
      canvas.getBoundingClientRect();


    const x=
      (
        e.clientX-
        rect.left
      )*
      (
        canvas.width/
        rect.width
      );


    const y=
      (
        e.clientY-
        rect.top
      )*
      (
        canvas.height/
        rect.height
      );


    /*
      Center area.

      Tapping here pauses.
    */

    const centerWidth=
      canvas.width*.45;

    const centerHeight=
      canvas.height*.35;


    const left=
      (
        canvas.width-
        centerWidth
      )/2;


    const top=
      (
        canvas.height-
        centerHeight
      )/2;


    if(

      x>=left &&

      x<=
        left+
        centerWidth &&

      y>=top &&

      y<=
        top+
        centerHeight

    ){

      pauseGame();
    }

  },
  {passive:true}
);


/* =====================================================
   DRAW
===================================================== */

function draw(){

  /*
    Clear.
  */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Road.
  */

  drawBackground();


  /*
    Items.
  */

  drawItems();


  /*
    Traffic.
  */

  drawTraffic();


  /*
    Player.
  */

  drawPlayer();


  /* =================================================
     SLOW MODE INDICATOR
  ================================================= */

  if(
    state.slowTimer>0
  ){

    ctx.fillStyle=
      "rgba(155,89,255,.10)";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle=
      "#ffffff";


    ctx.font=
      "bold 16px Arial";


    ctx.textAlign=
      "center";


    ctx.fillText(
      "SLOW MODE",
      canvas.width/2,
      80
    );
  }


  /* =================================================
     NEAR MISS
  ================================================= */

  if(
    state.nearMissTimer>0
  ){

    ctx.fillStyle=
      "#ffe600";


    ctx.font=
      "bold 20px Arial";


    ctx.textAlign=
      "center";


    ctx.fillText(
      "NICE!",
      canvas.width/2,
      120
    );
  }


  /* =================================================
     CRASH FLASH
  ================================================= */

  if(
    state.flash>0
  ){

    ctx.fillStyle=
      "rgba(255,0,0,.18)";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }


  /* =================================================
     PAUSE
  ================================================= */

  if(
    state.paused
  ){

    ctx.fillStyle=
      "rgba(0,0,0,.35)";


    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle=
      "#ffffff";


    ctx.font=
      "bold 28px Arial";


    ctx.textAlign=
      "center";


    ctx.fillText(
      "PAUSED",
      canvas.width/2,
      canvas.height/2-35
    );


    ctx.font=
      "16px Arial";


    ctx.fillText(
      "Tap Resume to continue",
      canvas.width/2,
      canvas.height/2+5
    );


    ctx.font=
      "14px Arial";


    ctx.fillText(
      "Use ◀ and ▶ buttons",
      canvas.width/2,
      canvas.height/2+32
    );
  }
}


/* =====================================================
   GAME LOOP
===================================================== */

function animate(timestamp){

  if(
    !state.lastTime
  ){

    state.lastTime=
      timestamp;
  }


  let dt=
    (
      timestamp-
      state.lastTime
    )/1000;


  state.lastTime=
    timestamp;


  /*
    Safety.
  */

  if(
    !Number.isFinite(dt)
  ){

    dt=0;
  }


  /*
    Prevent huge jumps when
    returning to the game.
  */

  if(dt>.05){

    dt=.05;
  }


  /* =================================================
     GAME UPDATE
  ================================================= */

  if(
    state.running &&
    !state.paused
  ){

    /*
      Fuel.
    */

    state.fuel-=
      dt*1.8;


    if(
      state.fuel<0
    ){

      state.fuel=0;
    }


    /*
      Slow timer.
    */

    if(
      state.slowTimer>0
    ){

      state.slowTimer-=dt;


      if(
        state.slowTimer<=0
      ){

        state.slowTimer=0;

        state.speedMultiplier=1;
      }
    }


    /*
      Invulnerability.
    */

    if(
      state.invulnerable>0
    ){

      state.invulnerable-=dt;
    }


    /*
      Crash flash.
    */

    if(
      state.flash>0
    ){

      state.flash-=dt;
    }


    /*
      Near miss text.
    */

    if(
      state.nearMissTimer>0
    ){

      state.nearMissTimer-=dt;
    }


    /*
      Road movement.
    */

    road.offset+=
      state.roadSpeed*
      state.speedMultiplier*
      dt;


    const dashTotal=80;


    if(
      road.offset>=
      dashTotal
    ){

      road.offset-=
        dashTotal;
    }


    /*
      Score increases while driving.
    */

    state.score+=
      dt*
      5*
      state.speedMultiplier;


    /*
      Spawn and update.
    */

    spawnCars(dt);

    spawnItems(dt);

    updateCars(dt);

    updateItems(dt);

    updatePlayer();


    /*
      Collision.
    */

    checkCollisions();


    /*
      Out of fuel.
    */

    if(
      state.fuel<=0
    ){

      state.fuel=0;

      gameOver();
    }


    updateHUD();
  }


  /*
    Always draw.
  */

  draw();


  requestAnimationFrame(
    animate
  );
}


/* =====================================================
   FINAL INITIALIZATION
===================================================== */

buildRoad();

resetGame();

updateHUD();


/*
  Start animation.
*/

requestAnimationFrame(
  animate
);


/* =====================================================
   END OF ROAD RUSH
===================================================== */

</script>
