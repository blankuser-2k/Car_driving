<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Road Rush</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111827;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.game{
  position:relative;
  width:min(94vw,420px);
  height:min(94vh,760px);
  aspect-ratio:420/760;
  overflow:hidden;
  border-radius:18px;
  background:#222;
  box-shadow:0 10px 35px rgba(0,0,0,.5);
}

canvas{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

.hud{
  position:absolute;
  top:10px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:5px;
  z-index:5;
  pointer-events:none;
}

.hudBox{
  flex:1;
  min-width:0;
  padding:6px 3px;
  border-radius:9px;
  background:rgba(0,0,0,.58);
  color:white;
  text-align:center;
  font-size:10px;
  font-weight:bold;
}

.hudValue{
  display:block;
  margin-top:2px;
  font-size:14px;
}

.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:15px;
  display:flex;
  justify-content:center;
  gap:25px;
  z-index:10;
}

.arrow{
  width:65px;
  height:52px;
  border:0;
  border-radius:14px;
  background:rgba(0,0,0,.6);
  color:white;
  font-size:27px;
  font-weight:bold;
  touch-action:manipulation;
}

.arrow:active{
  transform:scale(.92);
  background:#2563eb;
}

.overlay{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  background:rgba(0,0,0,.72);
}

.overlay.hidden{
  display:none;
}

.panel{
  width:min(94%,350px);
  padding:22px 18px;
  border-radius:20px;
  background:#111827;
  color:white;
  text-align:center;
}

.panel h1{
  margin:0 0 8px;
  font-size:29px;
}

.panel p{
  margin:8px 0;
  color:#d1d5db;
  font-size:14px;
  line-height:1.4;
}

.mainBtn{
  width:100%;
  margin-top:14px;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

.mainBtn:active{
  transform:scale(.97);
}

.options{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.optionBtn{
  flex:1;
  padding:10px 5px;
  border:1px solid #475569;
  border-radius:10px;
  background:#263244;
  color:white;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

.optionBtn.active{
  background:#2563eb;
  border-color:#60a5fa;
}

.help{
  margin-top:12px;
  color:#cbd5e1;
  font-size:12px;
  line-height:1.5;
}

.status{
  min-height:18px;
  margin-top:8px;
  color:#93c5fd;
  font-size:12px;
}

@media(max-height:600px){

  .game{
    width:min(92vw,330px);
    height:min(94vh,600px);
  }

  .panel{
    padding:16px;
  }

  .panel h1{
    font-size:24px;
  }

  .arrow{
    width:55px;
    height:44px;
  }
}

</style>

</head>


<body>


<div class="game" id="gameBox">

  <canvas
    id="gameCanvas"
    width="420"
    height="760">
  </canvas>


  <div class="hud">

    <div class="hudBox">
      SCORE
      <span
        class="hudValue"
        id="score">
        0
      </span>
    </div>

    <div class="hudBox">
      COINS
      <span
        class="hudValue"
        id="coins">
        0
      </span>
    </div>

    <div class="hudBox">
      LIVES
      <span
        class="hudValue"
        id="lives">
        ❤️❤️❤️
      </span>
    </div>

    <div class="hudBox">
      FUEL
      <span
        class="hudValue"
        id="fuel">
        100
      </span>
    </div>

  </div>


  <div class="controls">

    <button
      class="arrow"
      id="leftBtn">
      ◀
    </button>

    <button
      class="arrow"
      id="rightBtn">
      ▶
    </button>

  </div>


  <div
    class="overlay"
    id="overlay">

    <div class="panel">

      <h1 id="title">
        Road Rush
      </h1>

      <p id="message">
        Avoid traffic, collect coins
        and keep your fuel.
      </p>


      <div
        class="options"
        id="options">

        <button
          class="optionBtn active"
          id="buttonMode">
          🎮 Buttons
        </button>

        <button
          class="optionBtn"
          id="tiltMode">
          📱 Tilt
        </button>

      </div>


      <button
        class="mainBtn"
        id="mainBtn">
        Start Game
      </button>


      <div
        class="help"
        id="help">
        ◀ ▶ Use buttons or Arrow Keys
      </div>


      <div
        class="status"
        id="status">
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas =
  document.getElementById(
    "gameCanvas"
  );

const ctx =
  canvas.getContext("2d");


/* =========================
   HTML ELEMENTS
========================= */

const scoreEl =
  document.getElementById("score");

const coinsEl =
  document.getElementById("coins");

const livesEl =
  document.getElementById("lives");

const fuelEl =
  document.getElementById("fuel");

const overlay =
  document.getElementById("overlay");

const titleEl =
  document.getElementById("title");

const messageEl =
  document.getElementById("message");

const mainBtn =
  document.getElementById("mainBtn");

const buttonMode =
  document.getElementById("buttonMode");

const tiltMode =
  document.getElementById("tiltMode");

const helpEl =
  document.getElementById("help");

const statusEl =
  document.getElementById("status");

const leftBtn =
  document.getElementById("leftBtn");

const rightBtn =
  document.getElementById("rightBtn");


/* =========================
   AUDIO
========================= */

let audioCtx=null;


function initAudio(){

  if(!audioCtx){

    try{

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }catch(error){

      audioCtx=null;
    }
  }

  if(
    audioCtx &&
    audioCtx.state==="suspended"
  ){

    audioCtx.resume();
  }
}


function beep(
  frequency,
  duration,
  type="sine",
  volume=.05,
  endFrequency=null
){

  if(!audioCtx){
    return;
  }

  const oscillator =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  oscillator.type=type;

  oscillator.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );

  if(endFrequency){

    oscillator.frequency.linearRampToValueAtTime(
      endFrequency,
      audioCtx.currentTime+
      duration
    );
  }

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+
    duration
  );

  oscillator.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  oscillator.start();

  oscillator.stop(
    audioCtx.currentTime+
    duration
  );
}


function coinSound(){

  beep(
    900,
    .08,
    "square",
    .04,
    1300
  );
}


function fuelSound(){

  beep(
    450,
    .12,
    "sine",
    .05,
    700
  );
}


function slowSound(){

  beep(
    300,
    .18,
    "sawtooth",
    .04,
    150
  );
}


function crashSound(){

  beep(
    90,
    .25,
    "sawtooth",
    .08,
    40
  );
}


function pauseSound(){

  beep(
    500,
    .08,
    "square",
    .04,
    350
  );
}


function resumeSound(){

  beep(
    350,
    .08,
    "square",
    .04,
    550
  );
}


/* =========================
   ROAD
========================= */

const road={

  x:35,

  width:350,

  offset:0,

  lanes:[]
};


function buildRoad(){

  const laneWidth=
    road.width/3;

  road.lanes=[

    road.x+
    laneWidth*.5,

    road.x+
    laneWidth*1.5,

    road.x+
    laneWidth*2.5

  ];
}


/* =========================
   PLAYER
========================= */

const player={

  lane:1,

  x:210,

  y:650,

  width:46,

  height:78
};


/* =========================
   GAME STATE
========================= */

const state={

  running:false,

  paused:false,

  score:0,

  coins:0,

  lives:3,

  fuel:100,

  roadSpeed:180,

  speedMultiplier:1,

  slowTimer:0,

  spawnTimer:0,

  itemTimer:0,

  lastTime:0,

  invulnerable:0,

  flash:0,

  control:"buttons",

  cars:[],

  items:[],

  nearMissTimer:0,

  tiltCooldown:0

};


/* =========================
   TRAFFIC TYPES
========================= */

const trafficTypes=[

  {
    type:"car",
    color:"#ef4444",
    width:46,
    height:76
  },

  {
    type:"taxi",
    color:"#facc15",
    width:46,
    height:76
  },

  {
    type:"truck",
    color:"#3b82f6",
    width:52,
    height:92
  },

  {
    type:"bus",
    color:"#a855f7",
    width:55,
    height:105
  }

];


/* =========================
   UPDATE HUD
========================= */

function updateHUD(){

  scoreEl.textContent=
    Math.floor(
      state.score
    );

  coinsEl.textContent=
    state.coins;

  livesEl.textContent=
    "❤️".repeat(
      Math.max(
        0,
        state.lives
      )
    );

  fuelEl.textContent=
    Math.floor(
      state.fuel
    );
}


/* =========================
   RESET
========================= */

function resetGame(){

  state.score=0;

  state.coins=0;

  state.lives=3;

  state.fuel=100;

  state.roadSpeed=180;

  state.speedMultiplier=1;

  state.slowTimer=0;

  state.spawnTimer=.5;

  state.itemTimer=1;

  state.invulnerable=0;

  state.flash=0;

  state.cars=[];

  state.items=[];

  state.nearMissTimer=0;

  state.tiltCooldown=0;

  player.lane=1;

  player.x=
    road.lanes[1];

  player.y=650;

  updateHUD();
}


/* =========================
   START GAME
========================= */

function startGame(){

  initAudio();

  resetGame();

  state.running=true;

  state.paused=false;

  titleEl.textContent=
    "Road Rush";

  messageEl.textContent=
    "Avoid traffic, collect coins and fuel.";

  mainBtn.textContent=
    "Restart";

  statusEl.textContent="";

  hideOverlay();

  beep(
    600,
    .1,
    "sine",
    .04,
    900
  );
}


/* =========================
   GAME OVER
========================= */

function gameOver(reason){

  state.running=false;

  state.paused=false;

  crashSound();

  titleEl.textContent=
    "Game Over";

  messageEl.innerHTML=
    reason+
    "<br><br>Score: "+
    Math.floor(state.score)+
    "<br>Coins: "+
    state.coins;

  mainBtn.textContent=
    "Play Again";

  showOverlay();
}


/* =========================
   MOVEMENT
========================= */

function moveLeft(){

  if(
    !state.running ||
    state.paused
  ){
    return;
  }

  if(
    player.lane>0
  ){

    player.lane--;

    beep(
      500,
      .05,
      "square",
      .025
    );
  }
}


function moveRight(){

  if(
    !state.running ||
    state.paused
  ){
    return;
  }

  if(
    player.lane<2
  ){

    player.lane++;

    beep(
      600,
      .05,
      "square",
      .025
    );
  }
}


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      e.preventDefault();

      moveLeft();
    }


    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      e.preventDefault();

      moveRight();
    }


    if(
      e.key===" " ||
      e.key.toLowerCase()==="p"
    ){

      e.preventDefault();

      togglePause();
    }
  }
);


/* =========================
   MOBILE BUTTONS
========================= */

leftBtn.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    initAudio();

    moveLeft();
  }
);


rightBtn.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    initAudio();

    moveRight();
  }
);


/* =========================
   OVERLAY
========================= */

function showOverlay(){

  overlay.classList.remove(
    "hidden"
  );
}


function hideOverlay(){

  overlay.classList.add(
    "hidden"
  );
}


/* =========================
   MAIN BUTTON
========================= */

mainBtn.addEventListener(
  "click",
  function(){

    initAudio();

    if(state.paused){

      resumeGame();

    }else{

      startGame();
    }
  }
);


/* =========================
   BUTTON MODE
========================= */

buttonMode.addEventListener(
  "click",
  function(){

    state.control="buttons";

    buttonMode.classList.add(
      "active"
    );

    tiltMode.classList.remove(
      "active"
    );

    helpEl.innerHTML=
      "◀ ▶ Use buttons or Arrow Keys";

    statusEl.textContent=
      "Button control selected";

    beep(
      700,
      .08,
      "sine",
      .04
    );
  }
);


/* =========================
   TILT MODE
========================= */

tiltMode.addEventListener(
  "click",
  async function(){

    initAudio();

    if(
      !("DeviceOrientationEvent"
        in window)
    ){

      statusEl.textContent=
        "Tilt is not supported on this device.";

      return;
    }

    try{

      if(
        typeof DeviceOrientationEvent
          .requestPermission ===
        "function"
      ){

        const permission =
          await DeviceOrientationEvent
            .requestPermission();

        if(
          permission!=="granted"
        ){

          statusEl.textContent=
            "Motion permission denied.";

          return;
        }
      }


      state.control="tilt";

      tiltMode.classList.add(
        "active"
      );

      buttonMode.classList.remove(
        "active"
      );

      helpEl.innerHTML=
        "📱 Tilt your phone left or right<br>"+
        "to change lanes";

      statusEl.textContent=
        "Tilt control selected";

      beep(
        700,
        .1,
        "sine",
        .05,
        1000
      );

    }catch(error){

      statusEl.textContent=
        "Could not enable tilt.";
    }
  }
);


/* =========================
   PAUSE FUNCTION
========================= */

function togglePause(){

  if(!state.running){
    return;
  }

  if(state.paused){

    resumeGame();

  }else{

    pauseGame();
  }
}


function pauseGame(){

  if(
    !state.running ||
    state.paused
  ){
    return;
  }

  state.paused=true;

  pauseSound();

  titleEl.textContent=
    "Game Paused";

  messageEl.textContent=
    "Choose your control method.";

  mainBtn.textContent=
    "Resume";

  showOverlay();
}


function resumeGame(){

  if(
    !state.running ||
    !state.paused
  ){
    return;
  }

  state.paused=false;

  resumeSound();

  hideOverlay();
}


/* =========================
   NEXT PART
========================= *//* =========================
   CREATE TRAFFIC
========================= */

function createTraffic(){

  const lane =
    Math.floor(
      Math.random()*3
    );

  const data =
    trafficTypes[
      Math.floor(
        Math.random()*
        trafficTypes.length
      )
    ];

  return {

    lane:lane,

    x:
      road.lanes[lane]-
      data.width/2,

    y:
      -data.height-20,

    width:data.width,

    height:data.height,

    color:data.color,

    type:data.type,

    passed:false
  };
}


/* =========================
   SPAWN TRAFFIC
========================= */

function spawnCars(dt){

  state.spawnTimer-=dt;

  if(
    state.spawnTimer>0
  ){
    return;
  }

  /*
    Keep traffic speed reasonable.
  */

  state.spawnTimer=
    Math.max(
      .45,
      1.05-
      state.roadSpeed/800
    );

  state.cars.push(
    createTraffic()
  );
}


/* =========================
   UPDATE TRAFFIC
========================= */

function updateCars(dt){

  for(
    let i=
      state.cars.length-1;
    i>=0;
    i--
  ){

    const car=
      state.cars[i];

    car.y+=
      state.roadSpeed*
      state.speedMultiplier*
      dt;


    /*
      Near miss bonus
    */

    if(
      !car.passed &&
      car.y>
      player.y+
      player.height
    ){

      car.passed=true;

      const distance=
        Math.abs(
          (
            car.x+
            car.width/2
          )-
          player.x
        );

      if(
        distance<65 &&
        state.nearMissTimer<=0
      ){

        state.score+=25;

        state.nearMissTimer=1;

        beep(
          800,
          .08,
          "triangle",
          .035,
          1100
        );

        statusEl.textContent=
          "+25 Near Miss!";
      }
    }


    /*
      Remove cars outside screen
    */

    if(
      car.y>
      canvas.height+120
    ){

      state.cars.splice(
        i,
        1
      );
    }
  }


  if(
    state.nearMissTimer>0
  ){

    state.nearMissTimer-=dt;
  }


  checkCollisions();
}


/* =========================
   COLLISION CHECK
========================= */

function checkCollisions(){

  if(
    state.invulnerable>0
  ){
    return;
  }


  const playerLeft=
    player.x-
    player.width/2;

  const playerTop=
    player.y-
    player.height/2;


  for(
    const car of state.cars
  ){

    const collision=
      playerLeft<
      car.x+
      car.width &&

      playerLeft+
      player.width>
      car.x &&

      playerTop<
      car.y+
      car.height &&

      playerTop+
      player.height>
      car.y;


    if(collision){

      crashPlayer();

      break;
    }
  }
}


/* =========================
   CRASH PLAYER
========================= */

function crashPlayer(){

  state.lives--;

  state.invulnerable=1.5;

  state.flash=.7;

  crashSound();

  updateHUD();


  if(
    state.lives<=0
  ){

    gameOver(
      "No Lives Left"
    );

    return;
  }


  statusEl.textContent=
    "Crash! Life lost.";


  /*
    Remove traffic close
    to the player.
  */

  state.cars=
    state.cars.filter(
      function(car){

        return Math.abs(
          car.y-player.y
        )>120;
      }
    );
}


/* =========================
   CREATE ITEM
========================= */

function createItem(){

  const lane=
    Math.floor(
      Math.random()*3
    );


  const random=
    Math.random();

  let type;


  /*
    60% coin
    22% fuel
    18% speed reducer
  */

  if(
    random<.60
  ){

    type="coin";

  }else if(
    random<.82
  ){

    type="fuel";

  }else{

    type="slow";
  }


  return {

    type:type,

    lane:lane,

    x:
      road.lanes[lane],

    y:-35,

    size:
      type==="slow"
      ?32
      :28
  };
}


/* =========================
   SPAWN ITEMS
========================= */

function spawnItems(dt){

  state.itemTimer-=dt;

  if(
    state.itemTimer>0
  ){
    return;
  }


  state.itemTimer=
    1.4+
    Math.random()*1.4;


  state.items.push(
    createItem()
  );
}


/* =========================
   UPDATE ITEMS
========================= */

function updateItems(dt){

  for(
    let i=
      state.items.length-1;
    i>=0;
    i--
  ){

    const item=
      state.items[i];


    item.y+=
      state.roadSpeed*
      state.speedMultiplier*
      dt;


    /*
      Collect item
    */

    const touching=

      Math.abs(
        item.x-player.x
      )<

      player.width/2+
      item.size/2

      &&

      Math.abs(
        item.y-player.y
      )<

      player.height/2+
      item.size/2;


    if(touching){

      collectItem(item);

      state.items.splice(
        i,
        1
      );

      continue;
    }


    /*
      Remove item outside screen
    */

    if(
      item.y>
      canvas.height+60
    ){

      state.items.splice(
        i,
        1
      );
    }
  }
}


/* =========================
   COLLECT ITEM
========================= */

function collectItem(item){

  /*
    COIN
  */

  if(
    item.type==="coin"
  ){

    state.coins++;

    state.score+=10;

    coinSound();

    statusEl.textContent=
      "+10 Coin";
  }


  /*
    FUEL
  */

  else if(
    item.type==="fuel"
  ){

    state.fuel=
      Math.min(
        100,
        state.fuel+30
      );

    state.score+=15;

    fuelSound();

    statusEl.textContent=
      "+30 Fuel";
  }


  /*
    SPEED REDUCER
  */

  else if(
    item.type==="slow"
  ){

    state.speedMultiplier=.55;

    state.slowTimer=5;

    state.score+=20;

    slowSound();

    statusEl.textContent=
      "🐢 Speed Reduced!";
  }


  updateHUD();
}


/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(dt){

  const target=
    road.lanes[
      player.lane
    ];


  /*
    Smooth movement
  */

  player.x+=
    (
      target-
      player.x
    )*
    Math.min(
      1,
      dt*12
    );


  /*
    Score increases slowly
  */

  state.score+=
    dt*14;


  /*
    Fuel decreases slowly
  */

  state.fuel-=
    dt*1.55;


  /*
    Road speed increases,
    but never becomes too fast.
  */

  state.roadSpeed+=
    dt*3.2;

  state.roadSpeed=
    Math.min(
      360,
      state.roadSpeed
    );


  /*
    Speed reducer timer
  */

  if(
    state.slowTimer>0
  ){

    state.slowTimer-=dt;


    if(
      state.slowTimer<=0
    ){

      state.slowTimer=0;

      state.speedMultiplier=1;

      statusEl.textContent="";
    }
  }


  /*
    Invulnerability timer
  */

  if(
    state.invulnerable>0
  ){

    state.invulnerable-=dt;
  }


  /*
    Crash flash timer
  */

  if(
    state.flash>0
  ){

    state.flash-=dt;
  }


  /*
    Tilt cooldown
  */

  if(
    state.tiltCooldown>0
  ){

    state.tiltCooldown-=dt;
  }


  /*
    Fuel empty
  */

  if(
    state.fuel<=0
  ){

    state.fuel=0;

    gameOver(
      "Fuel Empty"
    );

    return;
  }


  updateHUD();
}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

  /*
    Grass
  */

  ctx.fillStyle="#208c4b";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Road shoulders
  */

  ctx.fillStyle="#6b7280";

  ctx.fillRect(
    road.x-18,
    0,
    18,
    canvas.height
  );

  ctx.fillRect(
    road.x+
    road.width,
    0,
    18,
    canvas.height
  );


  /*
    Road
  */

  ctx.fillStyle="#30343b";

  ctx.fillRect(
    road.x,
    0,
    road.width,
    canvas.height
  );


  /*
    Lane markings
  */

  const dashLength=42;

  const gapLength=22;

  const cycle=
    dashLength+
    gapLength;

  const offset=
    road.offset%cycle;


  ctx.fillStyle="#f3f4f6";


  for(
    let y=-cycle+offset;
    y<canvas.height+cycle;
    y+=cycle
  ){

    ctx.fillRect(
      road.x+
      road.width/3-3,
      y,
      6,
      dashLength
    );

    ctx.fillRect(
      road.x+
      road.width*2/3-3,
      y,
      6,
      dashLength
    );
  }


  /*
    Road edges
  */

  ctx.fillStyle="#e5e7eb";

  ctx.fillRect(
    road.x-2,
    0,
    4,
    canvas.height
  );

  ctx.fillRect(
    road.x+
    road.width-2,
    0,
    4,
    canvas.height
  );
}


/* =========================
   DRAW CAR
========================= */

function drawCar(
  x,
  y,
  width,
  height,
  color,
  type="car",
  playerCar=false
){

  ctx.save();

  ctx.translate(
    x,
    y
  );


  /*
    Main body
  */

  ctx.fillStyle=color;

  ctx.fillRect(
    -width/2,
    -height/2,
    width,
    height
  );


  /*
    Front window
  */

  ctx.fillStyle=
    playerCar
    ? "#e5f6ff"
    : "rgba(255,255,255,.28)";

  ctx.fillRect(
    -width/2+7,
    -height/2+8,
    width-14,
    16
  );


  /*
    Rear window
  */

  ctx.fillStyle=
    "rgba(10,20,30,.55)";

  ctx.fillRect(
    -width/2+7,
    height/2-23,
    width-14,
    12
  );


  /*
    Wheels
  */

  ctx.fillStyle="#111827";

  ctx.fillRect(
    -width/2+4,
    -height/2+10,
    7,
    17
  );

  ctx.fillRect(
    width/2-11,
    -height/2+10,
    7,
    17
  );

  ctx.fillRect(
    -width/2+4,
    height/2-27,
    7,
    17
  );

  ctx.fillRect(
    width/2-11,
    height/2-27,
    7,
    17
  );


  /*
    Taxi roof sign
  */

  if(
    type==="taxi"
  ){

    ctx.fillStyle="#fff4a3";

    ctx.fillRect(
      -9,
      -height/2-5,
      18,
      6
    );
  }


  /*
    Truck cargo
  */

  if(
    type==="truck"
  ){

    ctx.fillStyle=
      "rgba(255,255,255,.18)";

    ctx.fillRect(
      -width/2+5,
      -height/2+28,
      width-10,
      height-36
    );
  }


  /*
    Bus windows
  */

  if(
    type==="bus"
  ){

    ctx.fillStyle=
      "rgba(255,255,255,.22)";

    for(
      let i=0;
      i<3;
      i++
    ){

      ctx.fillRect(
        -width/2+6,
        -height/2+28+
        i*16,
        width-12,
        10
      );
    }
  }


  /*
    Border
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.35)";

  ctx.lineWidth=2;

  ctx.strokeRect(
    -width/2+2,
    -height/2+2,
    width-4,
    height-4
  );


  ctx.restore();
}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

  /*
    Blink after crash
  */

  if(
    state.invulnerable>0 &&
    Math.floor(
      state.invulnerable*10
    )%2===0
  ){

    return;
  }


  drawCar(
    player.x,
    player.y,
    player.width,
    player.height,
    "#ff5757",
    "car",
    true
  );
}


/* =========================
   DRAW ITEM
========================= */

function drawItem(item){

  ctx.save();

  ctx.translate(
    item.x,
    item.y
  );


  /*
    COIN
  */

  if(
    item.type==="coin"
  ){

    ctx.fillStyle="#f6c453";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      13,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#fff3a3";

    ctx.lineWidth=3;

    ctx.stroke();

    ctx.fillStyle="#805900";

    ctx.font=
      "bold 14px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "$",
      0,
      1
    );
  }


  /*
    FUEL
  */

  if(
    item.type==="fuel"
  ){

    ctx.fillStyle="#ef4444";

    ctx.fillRect(
      -12,
      -15,
      24,
      30
    );

    ctx.fillStyle="white";

    ctx.font=
      "bold 18px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "F",
      0,
      1
    );

    ctx.fillStyle="#111827";

    ctx.fillRect(
      5,
      -20,
      8,
      6
    );
  }


  /*
    SPEED REDUCER
  */

  if(
    item.type==="slow"
  ){

    ctx.fillStyle="#38bdf8";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      16,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#bae6fd";

    ctx.lineWidth=3;

    ctx.stroke();

    ctx.fillStyle="white";

    ctx.font=
      "bold 18px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "S",
      0,
      1
    );
  }


  ctx.restore();
      }/* =========================
   PART 3 / 4
========================= */

function drawTraffic(){

  for(const car of state.cars){
    drawCar(car);
  }
}


function drawItems(){

  for(const item of state.items){
    drawItem(item);
  }
}


/* =========================
   PAUSE BY CENTER TAP
========================= */

canvas.addEventListener(
  "pointerdown",
  function(e){

    if(!state.running){
      return;
    }

    if(state.paused){
      return;
    }

    /*
      Only the center area of the game
      pauses the game.
    */

    const rect =
      canvas.getBoundingClientRect();

    const x =
      e.clientX - rect.left;

    const y =
      e.clientY - rect.top;

    const scaleX =
      canvas.width / rect.width;

    const scaleY =
      canvas.height / rect.height;

    const cx = x * scaleX;
    const cy = y * scaleY;

    const centerWidth =
      canvas.width * 0.45;

    const centerHeight =
      canvas.height * 0.35;

    const centerLeft =
      (canvas.width - centerWidth) / 2;

    const centerTop =
      (canvas.height - centerHeight) / 2;

    if(
      cx >= centerLeft &&
      cx <= centerLeft + centerWidth &&
      cy >= centerTop &&
      cy <= centerTop + centerHeight
    ){

      pauseGame();
    }

  },
  {passive:true}
);


/* =========================
   MOBILE TILT CONTROL
========================= */

function handleTilt(event){

  if(
    !state.running ||
    state.paused ||
    state.control !== "tilt"
  ){
    return;
  }

  if(state.tiltCooldown > 0){
    return;
  }

  const gamma =
    event.gamma || 0;

  /*
    Phone tilted left
    Phone tilted right
  */

  if(gamma < -12){

    moveLeft();

    state.tiltCooldown = 0.30;
  }

  else if(gamma > 12){

    moveRight();

    state.tiltCooldown = 0.30;
  }
}


window.addEventListener(
  "deviceorientation",
  handleTilt
);


/* =========================
   DRAW GAME
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* Background and road */

  drawBackground();


  /* Items */

  drawItems();


  /* Traffic */

  drawTraffic();


  /* Player */

  drawPlayer();


  /* Slow effect */

  if(state.slowTimer > 0){

    ctx.fillStyle =
      "rgba(155,89,255,0.10)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "#ffffff";

    ctx.font =
      "bold 16px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
      "SLOW MODE",
      canvas.width / 2,
      80
    );
  }


  /* Near miss */

  if(state.nearMissTimer > 0){

    ctx.fillStyle = "#ffe600";

    ctx.font =
      "bold 20px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
      "NICE!",
      canvas.width / 2,
      120
    );
  }


  /* Flash effect */

  if(state.flash > 0){

    ctx.fillStyle =
      "rgba(255,0,0,0.18)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }


  /* Pause indicator */

  if(state.paused){

    ctx.fillStyle =
      "rgba(0,0,0,0.35)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "#ffffff";

    ctx.font =
      "bold 28px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
      "PAUSED",
      canvas.width / 2,
      canvas.height / 2 - 35
    );

    ctx.font =
      "16px Arial";

    ctx.fillText(
      "Tap Resume to continue",
      canvas.width / 2,
      canvas.height / 2 + 5
    );

    ctx.font =
      "14px Arial";

    ctx.fillText(
      state.control === "tilt"
        ? "Tilt phone to move"
        : "Use ◀ and ▶ buttons",
      canvas.width / 2,
      canvas.height / 2 + 32
    );
  }
}


/* =========================
   GAME LOOP
========================= */

function animate(timestamp){

  if(!state.lastTime){
    state.lastTime = timestamp;
  }

  let dt =
    (timestamp - state.lastTime) / 1000;

  state.lastTime = timestamp;


  /*
    Prevent a huge time jump
    after switching tabs.
  */

  if(dt > 0.05){
    dt = 0.05;
  }


  if(
    state.running &&
    !state.paused
  ){

    /* Fuel */

    state.fuel -=
      dt * 1.8;

    if(state.fuel < 0){
      state.fuel = 0;
    }


    /* Speed reducer timer */

    if(state.slowTimer > 0){

      state.slowTimer -= dt;

      if(state.slowTimer <= 0){

        state.slowTimer = 0;

        state.speedMultiplier = 1;
      }
    }


    /* Other timers */

    if(state.invulnerable > 0){
      state.invulnerable -= dt;
    }

    if(state.flash > 0){
      state.flash -= dt;
    }

    if(state.nearMissTimer > 0){
      state.nearMissTimer -= dt;
    }

    if(state.tiltCooldown > 0){
      state.tiltCooldown -= dt;
    }


    /* Road movement */

    road.offset +=
      state.roadSpeed *
      state.speedMultiplier *
      dt;

    const dashHeight = 45;
    const gap = 35;
    const total =
      dashHeight + gap;

    if(road.offset >= total){
      road.offset -= total;
    }


    /* Score */

    state.score +=
      dt * 5 *
      state.speedMultiplier;


    /* Spawn */

    spawnCars(dt);

    spawnItems(dt);


    /* Update */

    updateCars(dt);

    updateItems(dt);

    updatePlayer();

    checkCollisions();


    /* Empty fuel = game over */

    if(state.fuel <= 0){

      state.fuel = 0;

      gameOver();
    }


    updateHUD();
  }


  draw();


  requestAnimationFrame(
    animate
  );
}


/* =========================
   STARTUP
========================= */

buildRoad();

resetGame();

updateHUD();

requestAnimationFrame(
  animate
);</script>
