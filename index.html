<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover,
               maximum-scale=1.0,
               user-scalable=no">

<title>Road Rush</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101827;
  font-family:Arial,system-ui,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.game-wrap{
  position:relative;

  width:min(94vw,420px);
  height:min(94vh,760px);

  max-width:420px;
  max-height:760px;

  aspect-ratio:420 / 760;

  overflow:hidden;

  border-radius:20px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.45);

  background:#1f2937;
}

canvas{
  display:block;

  width:100%;
  height:100%;

  touch-action:none;
}

.hud{
  position:absolute;

  top:10px;
  left:10px;
  right:10px;

  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:6px;

  pointer-events:none;

  z-index:5;
}

.hud-box{
  min-width:70px;

  padding:7px 8px;

  border-radius:10px;

  background:
    rgba(0,0,0,.55);

  color:white;

  text-align:center;

  font-size:12px;
  font-weight:bold;

  backdrop-filter:blur(5px);
}

.hud-value{
  display:block;

  margin-top:2px;

  font-size:15px;
}

.overlay{
  position:absolute;

  inset:0;

  display:flex;

  justify-content:center;
  align-items:center;

  padding:20px;

  background:
    rgba(5,10,20,.72);

  z-index:20;

  transition:
    opacity .2s ease;
}

.overlay.hidden{
  display:none;
}

.panel{
  width:min(92%,340px);

  padding:22px 18px;

  border-radius:20px;

  background:
    rgba(17,24,39,.96);

  color:white;

  text-align:center;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.4);
}

.panel h1{
  margin:0 0 8px;

  font-size:30px;
}

.panel p{
  margin:7px 0;

  color:#d1d5db;

  font-size:14px;

  line-height:1.4;
}

.main-btn{
  width:100%;

  margin-top:14px;

  padding:13px 16px;

  border:0;

  border-radius:12px;

  background:#22c55e;

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;
}

.main-btn:active{
  transform:scale(.97);
}

.control-options{
  display:flex;

  gap:8px;

  margin-top:12px;
}

.control-btn{
  flex:1;

  padding:10px 6px;

  border:1px solid
    rgba(255,255,255,.2);

  border-radius:10px;

  background:#263244;

  color:white;

  font-size:12px;

  font-weight:bold;

  cursor:pointer;
}

.control-btn.active{
  background:#2563eb;

  border-color:#60a5fa;
}

.help{
  margin-top:12px;

  font-size:12px;

  color:#cbd5e1;

  line-height:1.5;
}

.status{
  min-height:18px;

  margin-top:8px;

  color:#93c5fd;

  font-size:12px;
}

.mobile-controls{
  position:absolute;

  left:0;
  right:0;
  bottom:15px;

  display:flex;

  justify-content:center;

  gap:22px;

  z-index:10;

  pointer-events:none;
}

.control-arrow{
  width:64px;
  height:52px;

  border:0;

  border-radius:15px;

  background:
    rgba(0,0,0,.58);

  color:white;

  font-size:28px;

  font-weight:bold;

  pointer-events:auto;

  touch-action:manipulation;
}

.control-arrow:active{
  transform:scale(.92);

  background:
    rgba(37,99,235,.8);
}

@media(max-height:600px){

  .game-wrap{
    width:min(92vw,330px);
    height:min(94vh,600px);
  }

  .panel h1{
    font-size:24px;
  }

  .control-arrow{
    width:55px;
    height:44px;
  }
}

@media(min-width:700px){

  .game-wrap{
    width:420px;
    height:760px;
  }
}

</style>

</head>


<body>


<div class="game-wrap">

  <canvas
    id="game"
    width="420"
    height="760">
  </canvas>


  <div class="hud">

    <div class="hud-box">
      SCORE
      <span
        class="hud-value"
        id="score">
        0
      </span>
    </div>

    <div class="hud-box">
      COINS
      <span
        class="hud-value"
        id="coins">
        0
      </span>
    </div>

    <div class="hud-box">
      LIVES
      <span
        class="hud-value"
        id="lives">
        ❤️❤️❤️
      </span>
    </div>

    <div class="hud-box">
      FUEL
      <span
        class="hud-value"
        id="fuel">
        100
      </span>
    </div>

  </div>


  <div
    class="mobile-controls">

    <button
      class="control-arrow"
      id="leftBtn">
      ◀
    </button>

    <button
      class="control-arrow"
      id="rightBtn">
      ▶
    </button>

  </div>


  <div
    class="overlay"
    id="overlay">

    <div class="panel">

      <h1 id="overlayTitle">
        Road Rush
      </h1>

      <p id="overlayText">
        Avoid traffic, collect coins
        and keep your fuel.
      </p>


      <div
        class="control-options"
        id="controlOptions">

        <button
          class="control-btn active"
          id="buttonControl">
          🎮 Buttons
        </button>

        <button
          class="control-btn"
          id="tiltControl">
          📱 Tilt
        </button>

      </div>


      <button
        class="main-btn"
        id="mainBtn">
        Start Game
      </button>


      <div
        class="help"
        id="helpText">

        ◀ ▶ Use buttons or Arrow Keys

      </div>


      <div
        class="status"
        id="status">
      </div>

    </div>

  </div>

</div>


<script>


/* =========================
   BASIC SETUP
========================= */

const canvas =
  document.getElementById(
    "game"
  );

const ctx =
  canvas.getContext("2d");


const scoreEl =
  document.getElementById(
    "score"
  );

const coinsEl =
  document.getElementById(
    "coins"
  );

const livesEl =
  document.getElementById(
    "lives"
  );

const fuelEl =
  document.getElementById(
    "fuel"
  );


const overlay =
  document.getElementById(
    "overlay"
  );

const overlayTitle =
  document.getElementById(
    "overlayTitle"
  );

const overlayText =
  document.getElementById(
    "overlayText"
  );

const mainBtn =
  document.getElementById(
    "mainBtn"
  );

const controlOptions =
  document.getElementById(
    "controlOptions"
  );

const buttonControl =
  document.getElementById(
    "buttonControl"
  );

const tiltControl =
  document.getElementById(
    "tiltControl"
  );

const helpText =
  document.getElementById(
    "helpText"
  );

const statusEl =
  document.getElementById(
    "status"
  );


const leftBtn =
  document.getElementById(
    "leftBtn"
  );

const rightBtn =
  document.getElementById(
    "rightBtn"
  );


/* =========================
   AUDIO
========================= */

let audioCtx=null;

function initAudio(){

  if(!audioCtx){

    try{

      audioCtx=
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }catch(e){

      audioCtx=null;
    }
  }

  if(
    audioCtx &&
    audioCtx.state==="suspended"
  ){

    audioCtx.resume();
  }
}


function beep(
  frequency,
  duration,
  type="sine",
  volume=.05,
  endFrequency=null
){

  if(!audioCtx) return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type=type;

  osc.frequency.setValueAtTime(
    frequency,
    audioCtx.currentTime
  );

  if(endFrequency){

    osc.frequency.linearRampToValueAtTime(
      endFrequency,
      audioCtx.currentTime+
      duration
    );
  }

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+
    duration
  );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start();

  osc.stop(
    audioCtx.currentTime+
    duration
  );
}


function coinSound(){

  beep(
    900,
    .08,
    "square",
    .04,
    1300
  );
}


function fuelSound(){

  beep(
    450,
    .12,
    "sine",
    .06,
    700
  );
}


function slowSound(){

  beep(
    300,
    .2,
    "sawtooth",
    .04,
    160
  );
}


function crashSound(){

  beep(
    90,
    .28,
    "sawtooth",
    .09,
    40
  );
}


function pauseSound(){

  beep(
    500,
    .08,
    "square",
    .04,
    350
  );
}


function resumeSound(){

  beep(
    350,
    .08,
    "square",
    .04,
    550
  );
}


function nearMissSound(){

  beep(
    700,
    .07,
    "triangle",
    .035,
    1000
  );
}


/* =========================
   ROAD
========================= */

const road={
  x:35,
  width:350,
  offset:0,
  lanePositions:[]
};


function buildLanePositions(){

  const laneWidth=
    road.width/3;

  road.lanePositions=[
    road.x+
    laneWidth*.5,

    road.x+
    laneWidth*1.5,

    road.x+
    laneWidth*2.5
  ];
}


/* =========================
   PLAYER
========================= */

const player={

  lane:1,

  x:210,

  y:650,

  width:46,

  height:78,

  targetX:210
};


/* =========================
   GAME STATE
========================= */

const state={

  running:false,

  paused:false,

  score:0,

  coins:0,

  lives:3,

  fuel:100,

  roadSpeed:180,

  speedMultiplier:1,

  speedEffectTimer:0,

  spawnTimer:0,

  itemTimer:0,

  lastTime:0,

  invulnerable:0,

  flash:0,

  controlMode:"buttons",

  cars:[],

  items:[],

  nearMissCooldown:0

};


/* =========================
   TRAFFIC COLORS
========================= */

const trafficTypes=[

  {
    type:"car",
    color:"#ef4444",
    width:46,
    height:76
  },

  {
    type:"taxi",
    color:"#facc15",
    width:46,
    height:76
  },

  {
    type:"truck",
    color:"#3b82f6",
    width:52,
    height:92
  },

  {
    type:"bus",
    color:"#a855f7",
    width:55,
    height:105
  }

];


/* =========================
   RESET PLAYER
========================= */

function resetPlayer(){

  player.lane=1;

  player.x=
    road.lanePositions[1];

  player.y=650;
}


/* =========================
   HUD
========================= */

function updateHUD(){

  scoreEl.textContent=
    Math.floor(
      state.score
    );

  coinsEl.textContent=
    state.coins;

  livesEl.textContent=
    "❤️".repeat(
      Math.max(
        0,
        state.lives
      )
    );

  fuelEl.textContent=
    Math.floor(
      state.fuel
    );
}


/* =========================
   START GAME
========================= */

function startGame(){

  initAudio();

  state.running=true;

  state.paused=false;

  state.score=0;

  state.coins=0;

  state.lives=3;

  state.fuel=100;

  state.roadSpeed=180;

  state.speedMultiplier=1;

  state.speedEffectTimer=0;

  state.spawnTimer=.4;

  state.itemTimer=1;

  state.invulnerable=0;

  state.flash=0;

  state.cars=[];

  state.items=[];

  state.nearMissCooldown=0;

  resetPlayer();

  updateHUD();

  overlayTitle.textContent=
    "Road Rush";

  overlayText.textContent=
    "Avoid traffic, collect coins and fuel.";

  mainBtn.textContent=
    "Restart";

  controlOptions.style.display=
    "flex";

  helpText.innerHTML=
    state.controlMode==="tilt"
    ?
    "📱 Tilt your phone left or right<br>to change lanes"
    :
    "◀ ▶ Use buttons or Arrow Keys";

  statusEl.textContent="";

  hideOverlay();
}


/* =========================
   GAME OVER
========================= */

function gameOver(reason){

  state.running=false;

  state.paused=false;

  crashSound();

  overlayTitle.textContent=
    "Game Over";

  overlayText.innerHTML=
    reason+
    "<br><br>"+
    "Score: "+
    Math.floor(state.score)+
    "<br>Coins: "+
    state.coins;

  mainBtn.textContent=
    "Play Again";

  controlOptions.style.display=
    "flex";

  helpText.innerHTML=
    "◀ ▶ Use buttons or Arrow Keys";

  showOverlay();
}


/* =========================
   PLAYER MOVEMENT
========================= */

function moveLeft(){

  if(
    !state.running ||
    state.paused
  ){
    return;
  }

  if(player.lane>0){

    player.lane--;

    beep(
      500,
      .05,
      "square",
      .025
    );
  }
}


function moveRight(){

  if(
    !state.running ||
    state.paused
  ){
    return;
  }

  if(player.lane<2){

    player.lane++;

    beep(
      600,
      .05,
      "square",
      .025
    );
  }
}


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      e.preventDefault();

      moveLeft();
    }


    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      e.preventDefault();

      moveRight();
    }


    if(
      e.key===" " ||
      e.key==="p"
    ){

      e.preventDefault();

      if(state.running){

        if(state.paused){

          resumeGame();

        }else{

          pauseGame();
        }
      }
    }
  }
);


/* =========================
   MOBILE BUTTONS
========================= */

leftBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    initAudio();

    moveLeft();
  }
);


rightBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    initAudio();

    moveRight();
  }
);


/* =========================
   TRAFFIC CREATION
========================= */

function createTraffic(){

  const lane =
    Math.floor(
      Math.random()*3
    );

  const data =
    trafficTypes[
      Math.floor(
        Math.random()*
        trafficTypes.length
      )
    ];

  return {

    lane:lane,

    x:
      road.lanePositions[lane]
      -data.width/2,

    y:
      -data.height-20,

    width:data.width,

    height:data.height,

    color:data.color,

    type:data.type,

    nearMiss:false,

    passed:false
  };
}


/* =========================
   SPAWN TRAFFIC
========================= */

function spawnCars(dt){

  state.spawnTimer-=dt;

  if(
    state.spawnTimer>0
  ){

    return;
  }

  state.spawnTimer=
    Math.max(
      .38,
      1.0-
      state.roadSpeed/700
    );

  state.cars.push(
    createTraffic()
  );
}


/* =========================
   UPDATE TRAFFIC
========================= */

function updateCars(dt){

  for(
    let i=
      state.cars.length-1;
    i>=0;
    i--
  ){

    const car=
      state.cars[i];

    car.y+=
      state.roadSpeed*
      state.speedMultiplier*
      dt;

    if(
      !car.passed &&
      car.y>
      player.y+
      player.height
    ){

      car.passed=true;

      const distance=
        Math.abs(
          (
            car.x+
            car.width/2
          )-
          player.x
        );

      if(
        distance<
        65 &&
        state.nearMissCooldown<=0
      ){

        state.score+=25;

        state.nearMissCooldown=1;

        nearMissSound();

        statusEl.textContent=
          "+25 Near Miss!";

      }
    }

    if(
      car.y>
      canvas.height+120
    ){

      state.cars.splice(
        i,
        1
      );
    }
  }


  if(
    state.nearMissCooldown>0
  ){

    state.nearMissCooldown-=dt;
  }


  checkCollisions();
}


/* =========================
   COLLISION
========================= */

function checkCollisions(){

  if(
    state.invulnerable>0
  ){

    return;
  }

  const px=
    player.x-
    player.width/2;

  const py=
    player.y-
    player.height/2;


  for(
    const car of state.cars
  ){

    const cx=car.x;

    const cy=car.y;

    if(
      px<
      cx+car.width &&
      px+player.width>
      cx &&
      py<
      cy+car.height &&
      py+player.height>
      cy
    ){

      crashPlayer();

      break;
    }
  }
}


/* =========================
   CRASH PLAYER
========================= */

function crashPlayer(){

  state.lives--;

  state.invulnerable=1.5;

  state.flash=.7;

  crashSound();

  updateHUD();

  if(
    state.lives<=0
  ){

    gameOver(
      "No Lives Left"
    );

    return;
  }

  statusEl.textContent=
    "Crash! Life lost.";

  /*
    Remove nearby traffic
    so the player gets a
    short recovery chance.
  */

  state.cars=
    state.cars.filter(
      car=>
        Math.abs(
          car.y-player.y
        )>120
    );
}


/* =========================
   ITEMS
========================= */

function createItem(){

  const lane=
    Math.floor(
      Math.random()*3
    );

  const r=
    Math.random();

  let type;

  if(r<.60){

    type="coin";

  }else if(r<.82){

    type="fuel";

  }else{

    type="slow";
  }

  return {

    type:type,

    lane:lane,

    x:
      road.lanePositions[lane],

    y:-30,

    size:
      type==="slow"
      ? 32
      : 28
  };
}


/* =========================
   SPAWN ITEMS
========================= */

function spawnItems(dt){

  state.itemTimer-=dt;

  if(
    state.itemTimer>0
  ){

    return;
  }

  state.itemTimer=
    1.3+
    Math.random()*1.5;

  state.items.push(
    createItem()
  );
}


/* =========================
   UPDATE ITEMS
========================= */

function updateItems(dt){

  for(
    let i=
      state.items.length-1;
    i>=0;
    i--
  ){

    const item=
      state.items[i];

    item.y+=
      state.roadSpeed*
      state.speedMultiplier*
      dt;


    if(
      Math.abs(
        item.x-player.x
      )<
      player.width/2+
      item.size/2 &&
      Math.abs(
        item.y-player.y
      )<
      player.height/2+
      item.size/2
    ){

      collectItem(item);

      state.items.splice(
        i,
        1
      );

      continue;
    }


    if(
      item.y>
      canvas.height+60
    ){

      state.items.splice(
        i,
        1
      );
    }
  }
}


/* =========================
   COLLECT ITEM
========================= */

function collectItem(item){

  if(
    item.type==="coin"
  ){

    state.coins++;

    state.score+=10;

    coinSound();

    statusEl.textContent=
      "+10 Coin";
  }


  if(
    item.type==="fuel"
  ){

    state.fuel=
      Math.min(
        100,
        state.fuel+30
      );

    state.score+=15;

    fuelSound();

    statusEl.textContent=
      "+30 Fuel";
  }


  if(
    item.type==="slow"
  ){

    state.speedMultiplier=.55;

    state.speedEffectTimer=5;

    state.score+=20;

    slowSound();

    statusEl.textContent=
      "🐢 Speed Reduced!";
  }

  updateHUD();
}


/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer(dt){

  const target=
    road.lanePositions[
      player.lane
    ];

  player.x+=
    (target-player.x)*
    Math.min(
      1,
      dt*12
    );

  state.score+=dt*14;

  state.fuel-=dt*1.55;

  state.roadSpeed+=dt*3.5;

  state.roadSpeed=
    Math.min(
      380,
      state.roadSpeed
    );

  if(
    state.speedEffectTimer>0
  ){

    state.speedEffectTimer-=dt;

    if(
      state.speedEffectTimer<=0
    ){

      state.speedEffectTimer=0;

      state.speedMultiplier=1;

      statusEl.textContent="";
    }
  }

  if(
    state.invulnerable>0
  ){

    state.invulnerable-=dt;
  }

  if(
    state.flash>0
  ){

    state.flash-=dt;
  }

  if(
    state.fuel<=0
  ){

    state.fuel=0;

    gameOver(
      "Fuel Empty"
    );

    return;
  }

  updateHUD();
}/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

  const sky =
    ctx.createLinearGradient(
      0,0,
      0,canvas.height
    );

  sky.addColorStop(
    0,
    "#203d5e"
  );

  sky.addColorStop(
    1,
    "#0e1e37"
  );

  ctx.fillStyle=sky;

  ctx.fillRect(
    0,0,
    canvas.width,
    canvas.height
  );


  /* Grass */

  ctx.fillStyle="#1f8f4d";

  ctx.fillRect(
    0,0,
    canvas.width,
    canvas.height
  );


  /* Road shoulders */

  ctx.fillStyle="#6b7280";

  ctx.fillRect(
    road.x-18,
    0,
    18,
    canvas.height
  );

  ctx.fillRect(
    road.x+road.width,
    0,
    18,
    canvas.height
  );


  /* Road */

  ctx.fillStyle="#2d3139";

  ctx.fillRect(
    road.x,
    0,
    road.width,
    canvas.height
  );


  /* Lane markings */

  const segment=45;
  const dash=18;

  const yOffset =
    (road.offset %
    (segment+dash)) -
    (segment+dash);

  ctx.fillStyle="#f3f4f6";

  for(
    let y=yOffset;
    y<canvas.height+100;
    y+=segment+dash
  ){

    ctx.fillRect(
      road.x+
      road.width/3-4,
      y,
      8,
      segment
    );

    ctx.fillRect(
      road.x+
      2*road.width/3-4,
      y,
      8,
      segment
    );
  }


  /* Road edges */

  ctx.fillStyle="#d1d5db";

  ctx.fillRect(
    road.x-2,
    0,
    4,
    canvas.height
  );

  ctx.fillRect(
    road.x+
    road.width-2,
    0,
    4,
    canvas.height
  );
}


/* =========================
   DRAW CAR
========================= */

function drawCar(
  x,
  y,
  width,
  height,
  color,
  type="car",
  isPlayer=false
){

  ctx.save();

  ctx.translate(x,y);


  /* Main body */

  ctx.fillStyle=color;

  ctx.fillRect(
    -width/2,
    -height/2,
    width,
    height
  );


  /* Front window */

  ctx.fillStyle =
    isPlayer
    ? "#f8fafc"
    : "rgba(255,255,255,.28)";

  ctx.fillRect(
    -width/2+7,
    -height/2+8,
    width-14,
    15
  );


  /* Rear window */

  ctx.fillStyle=
    "rgba(20,30,45,.55)";

  ctx.fillRect(
    -width/2+7,
    height/2-23,
    width-14,
    12
  );


  /* Wheels */

  ctx.fillStyle="#111827";

  ctx.fillRect(
    -width/2+4,
    -height/2+10,
    7,
    17
  );

  ctx.fillRect(
    width/2-11,
    -height/2+10,
    7,
    17
  );

  ctx.fillRect(
    -width/2+4,
    height/2-27,
    7,
    17
  );

  ctx.fillRect(
    width/2-11,
    height/2-27,
    7,
    17
  );


  /* Taxi sign */

  if(type==="taxi"){

    ctx.fillStyle="#fff7b2";

    ctx.fillRect(
      -9,
      -height/2-5,
      18,
      6
    );
  }


  /* Truck */

  if(type==="truck"){

    ctx.fillStyle=
      "rgba(255,255,255,.18)";

    ctx.fillRect(
      -width/2+5,
      -height/2+27,
      width-10,
      height-35
    );
  }


  /* Bus windows */

  if(type==="bus"){

    ctx.fillStyle=
      "rgba(255,255,255,.22)";

    for(
      let i=0;
      i<3;
      i++
    ){

      ctx.fillRect(
        -width/2+6,
        -height/2+28+i*15,
        width-12,
        10
      );
    }
  }


  /* Border */

  ctx.strokeStyle=
    "rgba(255,255,255,.35)";

  ctx.lineWidth=2;

  ctx.strokeRect(
    -width/2+2,
    -height/2+2,
    width-4,
    height-4
  );

  ctx.restore();
}


/* =========================
   PLAYER DRAW
========================= */

function drawPlayer(){

  if(
    state.invulnerable>0 &&
    Math.floor(
      state.invulnerable*10
    )%2===0
  ){

    return;
  }

  drawCar(
    player.x,
    player.y,
    player.width,
    player.height,
    "#ff5a5f",
    "car",
    true
  );
}


/* =========================
   DRAW ITEMS
========================= */

function drawItem(item){

  ctx.save();

  ctx.translate(
    item.x,
    item.y
  );


  /* COIN */

  if(item.type==="coin"){

    ctx.fillStyle="#f6c453";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      13,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#fff3a3";

    ctx.lineWidth=3;

    ctx.stroke();

    ctx.fillStyle="#8a5b00";

    ctx.font=
      "bold 14px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "$",
      0,
      1
    );
  }


  /* FUEL */

  if(item.type==="fuel"){

    ctx.fillStyle="#ef4444";

    ctx.fillRect(
      -12,
      -15,
      24,
      30
    );

    ctx.fillStyle="#f8fafc";

    ctx.font=
      "bold 18px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "F",
      0,
      1
    );

    ctx.fillStyle="#111827";

    ctx.fillRect(
      5,
      -20,
      8,
      6
    );
  }


  /* SPEED REDUCER */

  if(item.type==="slow"){

    ctx.fillStyle="#38bdf8";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      16,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#bae6fd";

    ctx.lineWidth=3;

    ctx.stroke();

    ctx.fillStyle="white";

    ctx.font=
      "bold 18px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "S",
      0,
      1
    );
  }

  ctx.restore();
}


/* =========================
   DRAW TRAFFIC
========================= */

function drawTraffic(){

  for(
    const car of state.cars
  ){

    drawCar(
      car.x+car.width/2,
      car.y+car.height/2,
      car.width,
      car.height,
      car.color,
      car.type,
      false
    );
  }
}


/* =========================
   DRAW ALL ITEMS
========================= */

function drawItems(){

  for(
    const item of state.items
  ){

    drawItem(item);
  }
}


/* =========================
   PAUSE GAME
========================= */

function pauseGame(){

  if(
    !state.running ||
    state.paused
  ){

    return;
  }

  state.paused=true;

  pauseSound();

  overlayTitle.textContent=
    "Game Paused";

  overlayText.textContent=
    "Choose your control method";

  mainBtn.textContent=
    "Resume";

  controlOptions.style.display=
    "flex";


  if(
    state.controlMode==="tilt"
  ){

    helpText.innerHTML=
      "📱 Tilt your phone left or right<br>"+
      "to change lanes";

  }else{

    helpText.innerHTML=
      "◀ ▶ Use buttons or Arrow Keys";
  }

  statusEl.textContent="";

  showOverlay();
}


/* =========================
   RESUME GAME
========================= */

function resumeGame(){

  if(
    !state.running ||
    !state.paused
  ){

    return;
  }

  state.paused=false;

  resumeSound();

  hideOverlay();
}


/* =========================
   OVERLAY
========================= */

function showOverlay(){

  overlay.classList.remove(
    "hidden"
  );
}


function hideOverlay(){

  overlay.classList.add(
    "hidden"
  );
}


/* =========================
   MAIN BUTTON
========================= */

mainBtn.addEventListener(
  "click",
  ()=>{

    initAudio();

    if(state.paused){

      resumeGame();

    }else{

      startGame();
    }
  }
);


/* =========================
   BUTTON CONTROL
========================= */

buttonControl.addEventListener(
  "click",
  ()=>{

    state.controlMode=
      "buttons";

    buttonControl.classList.add(
      "active"
    );

    tiltControl.classList.remove(
      "active"
    );

    helpText.innerHTML=
      "◀ ▶ Use buttons or Arrow Keys";

    statusEl.textContent=
      "Button control selected";
  }
);


/* =========================
   TILT CONTROL
========================= */

tiltControl.addEventListener(
  "click",
  async ()=>{

    initAudio();

    if(
      !("DeviceOrientationEvent"
        in window)
    ){

      statusEl.textContent=
        "Tilt control is not supported.";

      return;
    }


    if(
      typeof DeviceOrientationEvent
        .requestPermission ===
      "function"
    ){

      try{

        const permission =
          await DeviceOrientationEvent
            .requestPermission();

        if(
          permission!=="granted"
        ){

          statusEl.textContent=
            "Motion permission denied.";

          return;
        }

      }catch(error){

        statusEl.textContent=
          "Could not enable tilt.";

        return;
      }
    }


    state.controlMode="tilt";

    tiltControl.classList.add(
      "active"
    );

    buttonControl.classList.remove(
      "active"
    );

    helpText.innerHTML=
      "📱 Tilt your phone left or right<br>"+
      "to change lanes";

    statusEl.textContent=
      "Tilt control enabled";

    beep(
      700,
      .1,
      "sine",
      .05,
      200
    );
  }
);/* =========================
   CENTER PAUSE
========================= */

canvas.addEventListener(
  "pointerdown",
  e=>{

    if(
      !state.running ||
      state.paused
    ){

      return;
    }

    const rect =
      canvas.getBoundingClientRect();

    const x =
      (e.clientX-rect.left) *
      canvas.width /
      rect.width;

    const y =
      (e.clientY-rect.top) *
      canvas.height /
      rect.height;


    /*
      Center area used for pause.
      Avoids accidental pause near
      the control buttons.
    */

    const centerX =
      canvas.width/2;

    const centerWidth=120;

    const centerTop=180;

    const centerBottom=570;


    if(
      Math.abs(
        x-centerX
      )<
      centerWidth/2 &&
      y>centerTop &&
      y<centerBottom
    ){

      pauseGame();
    }
  }
);


/* =========================
   TILT CONTROL
========================= */

let tiltCooldown=0;


function handleTilt(event){

  if(
    !state.running ||
    state.paused ||
    state.controlMode!=="tilt"
  ){

    return;
  }


  if(
    tiltCooldown>0
  ){

    return;
  }


  const gamma =
    event.gamma || 0;


  /*
    Tilt left
  */

  if(
    gamma < -12
  ){

    moveLeft();

    tiltCooldown=.45;
  }


  /*
    Tilt right
  */

  else if(
    gamma > 12
  ){

    moveRight();

    tiltCooldown=.45;
  }
}


window.addEventListener(
  "deviceorientation",
  handleTilt
);


/* =========================
   UPDATE TILT
========================= */

function updateTilt(dt){

  if(
    tiltCooldown>0
  ){

    tiltCooldown-=dt;
  }
}


/* =========================
   DRAW
========================= */

function draw(){

  drawBackground();


  /*
    Moving road
  */

  road.offset=
    (
      road.offset+
      state.roadSpeed*
      state.speedMultiplier*
      .15
    )%1000;


  drawItems();

  drawTraffic();

  drawPlayer();


  /*
    Speed reducer indicator
  */

  if(
    state.speedEffectTimer>0
  ){

    ctx.save();

    ctx.fillStyle=
      "rgba(56,189,248,.85)";

    ctx.font=
      "bold 14px system-ui";

    ctx.textAlign="center";

    ctx.fillText(
      "🐢 SPEED REDUCED "+
      Math.ceil(
        state.speedEffectTimer
      ),
      canvas.width/2,
      92
    );

    ctx.restore();
  }


  /*
    Crash flash
  */

  if(
    state.flash>0
  ){

    ctx.fillStyle=
      "rgba(239,68,68,"+
      Math.min(
        .22,
        state.flash*.3
      )+
      ")";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }
}


/* =========================
   GAME LOOP
========================= */

function animate(ts){

  const dt=
    Math.min(
      .033,
      (ts-state.lastTime)/1000
      || .016
    );

  state.lastTime=ts;


  if(
    state.running &&
    !state.paused
  ){

    spawnCars(dt);

    spawnItems(dt);

    updateCars(dt);


    if(state.running){

      updateItems(dt);

      updatePlayer(dt);

      updateTilt(dt);
    }
  }


  draw();


  requestAnimationFrame(
    animate
  );
}
