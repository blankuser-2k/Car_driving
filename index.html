<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Road Rush</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#111;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.game{
  position:relative;
  width:min(94vw,420px);
  height:min(94vh,760px);
  aspect-ratio:420 / 760;
  background:#217a32;
  overflow:hidden;
  border-radius:18px;
  box-shadow:0 0 25px rgba(0,0,0,.7);
}

canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* HUD */

.hud{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  gap:5px;
  z-index:10;
  pointer-events:none;
}

.hudBox{
  min-width:65px;
  padding:5px 7px;
  background:rgba(0,0,0,.72);
  color:white;
  border-radius:8px;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  border:1px solid rgba(255,255,255,.25);
}

.hudBox span{
  display:block;
  margin-top:2px;
  font-size:15px;
}

.fuelBox{
  min-width:100px;
}

.fuelBar{
  width:80px;
  height:11px;
  margin:4px auto 2px;
  background:#333;
  border:1px solid #aaa;
  border-radius:8px;
  overflow:hidden;
}

#fuelFill{
  width:100%;
  height:100%;
  background:#35d04f;
  border-radius:7px;
  transition:
    width .2s linear,
    background .2s linear;
}

#fuel{
  font-size:12px;
}

/* OVERLAY */

.overlay{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.58);
  padding:20px;
}

.panel{
  width:90%;
  max-width:330px;
  padding:25px 18px;
  background:linear-gradient(180deg,#252525,#111);
  color:white;
  text-align:center;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.panel h1{
  margin:0 0 8px;
  font-size:32px;
}

.panel p{
  margin:8px 0 15px;
  line-height:1.5;
  color:#ddd;
}

/* MAIN BUTTON */

#mainBtn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#00bfff;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  touch-action:manipulation;
}

#mainBtn:active{
  transform:scale(.97);
}

/* CONTROL MODE */

.options{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.options button{
  flex:1;
  padding:9px 5px;
  border:1px solid #555;
  border-radius:8px;
  background:#333;
  color:white;
  font-size:13px;
  cursor:pointer;
  touch-action:manipulation;
}

.options button.active{
  background:#00a8df;
  border-color:#5ddcff;
}

.help{
  margin-top:12px;
  font-size:12px;
  color:#bbb;
}

/* MOBILE CONTROLS */

.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:15px;
  z-index:15;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.arrow{
  width:68px;
  height:58px;
  border:0;
  border-radius:15px;
  background:rgba(0,0,0,.62);
  color:white;
  font-size:30px;
  font-weight:bold;
  pointer-events:auto;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

.arrow:active{
  transform:scale(.92);
  background:rgba(0,0,0,.85);
}

/* TILT MODE HIDES BUTTONS */

.game.tiltActive .controls{
  display:none;
}

/* PAUSE BUTTON AREA */

.pauseHint{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:45%;
  height:35%;
  z-index:5;
  pointer-events:none;
}

/* SMALL SCREENS */

@media(max-height:650px){

  .controls{
    bottom:8px;
  }

  .arrow{
    width:58px;
    height:48px;
    font-size:25px;
  }

  .panel{
    padding:18px;
  }

  .panel h1{
    font-size:27px;
  }
}

</style>

</head>

<body>

<div class="game" id="gameBox">

<canvas
  id="gameCanvas"
  width="420"
  height="760">
</canvas>


<!-- HUD -->

<div class="hud">

  <div class="hudBox">
    SCORE
    <span id="score">0</span>
  </div>

  <div class="hudBox">
    COINS
    <span id="coins">0</span>
  </div>

  <div class="hudBox">
    LIVES
    <span id="lives">❤️ 3</span>
  </div>

  <div class="hudBox fuelBox">

    FUEL

    <div class="fuelBar">
      <div id="fuelFill"></div>
    </div>

    <span id="fuel">100%</span>

  </div>

</div>


<!-- START / GAME OVER / PAUSE -->

<div class="overlay" id="overlay">

  <div class="panel">

    <h1 id="title">
      ROAD RUSH
    </h1>

    <p id="message">
      Avoid traffic, collect coins
      and fuel packs!
    </p>

    <button id="mainBtn">
      Start Game
    </button>

    <div class="options">

      <button
        id="buttonMode"
        class="active">
        🎮 Buttons
      </button>

      <button
        id="tiltMode">
        📱 Tilt
      </button>

    </div>

    <div class="help" id="help">

      Buttons: use ◀ and ▶<br>
      Tap center of game to pause

    </div>

  </div>

</div>


<!-- MOBILE BUTTONS -->

<div class="controls">

  <button
    class="arrow"
    id="leftBtn">
    ◀
  </button>

  <button
    class="arrow"
    id="rightBtn">
    ▶
  </button>

</div>

</div>


<script>

/* =====================================================
   PART 1 - BASIC SETUP
===================================================== */

const canvas =
  document.getElementById("gameCanvas");

const ctx =
  canvas.getContext("2d");


/* HUD */

const scoreEl =
  document.getElementById("score");

const coinsEl =
  document.getElementById("coins");

const livesEl =
  document.getElementById("lives");

const fuelEl =
  document.getElementById("fuel");

const fuelFill =
  document.getElementById("fuelFill");


/* UI */

const gameBox =
  document.getElementById("gameBox");

const overlay =
  document.getElementById("overlay");

const title =
  document.getElementById("title");

const message =
  document.getElementById("message");

const mainBtn =
  document.getElementById("mainBtn");

const buttonMode =
  document.getElementById("buttonMode");

const tiltMode =
  document.getElementById("tiltMode");

const help =
  document.getElementById("help");

const leftBtn =
  document.getElementById("leftBtn");

const rightBtn =
  document.getElementById("rightBtn");


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;


function initAudio(){

  if(!audioContext){

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(AudioCtx){
      audioContext = new AudioCtx();
    }
  }

  if(
    audioContext &&
    audioContext.state === "suspended"
  ){
    audioContext.resume();
  }
}


function beep(
  frequency,
  duration,
  type="sine",
  volume=.06
){

  if(!audioContext) return;

  try{

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
      frequency;

    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + duration
    );

  }catch(error){}
}


function coinSound(){

  beep(880,.08,"square",.05);

  setTimeout(
    () => beep(
      1200,
      .08,
      "square",
      .04
    ),
    60
  );
}


function fuelSound(){

  beep(500,.12,"sine",.06);

  setTimeout(
    () => beep(
      750,
      .12,
      "sine",
      .05
    ),
    80
  );
}


function slowSound(){

  beep(
    250,
    .25,
    "triangle",
    .06
  );
}


function crashSound(){

  beep(
    90,
    .3,
    "sawtooth",
    .08
  );
}


function pauseSound(){

  beep(
    350,
    .08,
    "sine",
    .04
  );
}


function resumeSound(){

  beep(
    600,
    .08,
    "sine",
    .04
  );
}


/* =====================================================
   ROAD
===================================================== */

const road = {

  x:35,

  width:350,

  lanes:3,

  lanesX:[],

  offset:0

};


function buildRoad(){

  road.lanesX = [];

  const laneWidth =
    road.width / road.lanes;

  for(
    let i=0;
    i<road.lanes;
    i++
  ){

    road.lanesX.push(
      road.x +
      laneWidth*i +
      laneWidth/2
    );
  }
}


/* =====================================================
   PLAYER
===================================================== */

const player = {

  lane:1,

  x:210,

  y:650,

  width:46,

  height:78

};


/* =====================================================
   TRAFFIC TYPES
===================================================== */

const trafficTypes = [

  {
    name:"car",
    w:46,
    h:78,
    speed:180
  },

  {
    name:"taxi",
    w:46,
    h:78,
    speed:165
  },

  {
    name:"truck",
    w:52,
    h:92,
    speed:145
  },

  {
    name:"bus",
    w:58,
    h:110,
    speed:125
  }

];


/* =====================================================
   GAME STATE
===================================================== */

const state = {

  running:false,

  paused:false,

  score:0,

  coins:0,

  lives:3,

  fuel:100,

  roadSpeed:180,

  speedMultiplier:1,

  slowTimer:0,

  spawnTimer:0,

  itemTimer:0,

  lastTime:0,

  invulnerable:0,

  flash:0,

  control:"buttons",

  cars:[],

  items:[],

  nearMissTimer:0,

  tiltCooldown:0

};


/* HIGH SCORE */

let highScore = 0;

try{

  highScore =
    Number(
      localStorage.getItem(
        "roadRushHighScore"
      )
    ) || 0;

}catch(error){

  highScore=0;

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  if(!Number.isFinite(state.score))
    state.score=0;

  if(!Number.isFinite(state.coins))
    state.coins=0;

  if(!Number.isFinite(state.fuel))
    state.fuel=100;


  scoreEl.textContent =
    Math.floor(state.score);

  coinsEl.textContent =
    state.coins;

  livesEl.textContent =
    "❤️ " + state.lives;


  const fuelPercent =
    Math.max(
      0,
      Math.min(
        100,
        state.fuel
      )
    );

  fuelEl.textContent =
    Math.floor(fuelPercent) + "%";

  fuelFill.style.width =
    fuelPercent + "%";


  if(fuelPercent>50){

    fuelFill.style.background =
      "#35d04f";

  }else if(fuelPercent>25){

    fuelFill.style.background =
      "#ffd21f";

  }else{

    fuelFill.style.background =
      "#ff3333";
  }
}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

  state.running=false;
  state.paused=false;

  state.score=0;
  state.coins=0;
  state.lives=3;
  state.fuel=100;

  state.roadSpeed=180;
  state.speedMultiplier=1;
  state.slowTimer=0;

  state.spawnTimer=.9;
  state.itemTimer=1.5;

  state.lastTime=0;

  state.invulnerable=0;
  state.flash=0;

  state.cars=[];
  state.items=[];

  state.nearMissTimer=0;
  state.tiltCooldown=0;

  player.lane=1;
  player.x=road.lanesX[1];
  player.y=650;

  road.offset=0;

  updateHUD();
}


/* =====================================================
   START
===================================================== */

function startGame(){

  initAudio();

  resetGame();

  state.running=true;

  state.lastTime =
    performance.now();

  overlay.style.display="none";

  applyControlUI();

  updateHUD();
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  state.running=false;
  state.paused=false;

  const finalScore =
    Math.floor(state.score);

  if(finalScore>highScore){

    highScore=finalScore;

    try{

      localStorage.setItem(
        "roadRushHighScore",
        highScore
      );

    }catch(error){}
  }


  title.textContent="GAME OVER";

  message.innerHTML =
    "Score: " +
    finalScore +
    "<br>Coins: " +
    state.coins +
    "<br>Best: " +
    highScore;

  mainBtn.textContent="Play Again";

  overlay.style.display="flex";

  applyControlUI();

  updateHUD();
}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function moveLeft(){

  if(
    !state.running ||
    state.paused
  ) return;

  if(player.lane>0){

    player.lane--;

    player.x =
      road.lanesX[player.lane];
  }
}


function moveRight(){

  if(
    !state.running ||
    state.paused
  ) return;

  if(
    player.lane <
    road.lanes-1
  ){

    player.lane++;

    player.x =
      road.lanesX[player.lane];
  }
}


/* =====================================================
   CONTROL UI
===================================================== */

function applyControlUI(){

  if(state.control==="tilt"){

    gameBox.classList.add(
      "tiltActive"
    );

    buttonMode.classList.remove(
      "active"
    );

    tiltMode.classList.add(
      "active"
    );

    help.innerHTML =
      "Tilt phone left/right to move<br>" +
      "Tap center of game to pause";

  }else{

    gameBox.classList.remove(
      "tiltActive"
    );

    buttonMode.classList.add(
      "active"
    );

    tiltMode.classList.remove(
      "active"
    );

    help.innerHTML =
      "Buttons: use ◀ and ▶<br>" +
      "Tap center of game to pause";
  }
}


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      e.preventDefault();
      moveLeft();

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      e.preventDefault();
      moveRight();

    }

    if(
      e.key===" " ||
      e.key.toLowerCase()==="p"
    ){

      e.preventDefault();
      togglePause();
    }

  }
);


/* =====================================================
   MOBILE BUTTONS
===================================================== */

leftBtn.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    initAudio();

    moveLeft();

  },
  {passive:false}
);


rightBtn.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    initAudio();

    moveRight();

  },
  {passive:false}
);


/* =====================================================
   MAIN BUTTON
===================================================== */

mainBtn.addEventListener(
  "click",
  function(){

    if(!state.running){

      startGame();

    }else if(state.paused){

      resumeGame();
    }

  }
);


/* =========================
   END PART 1
========================= */
/* =====================================================
   PART 2 - CONTROL + PAUSE
===================================================== */


/* =====================================================
   BUTTON MODE
===================================================== */

buttonMode.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    initAudio();

    state.control="buttons";

    applyControlUI();

  }
);


/* =====================================================
   TILT MODE
===================================================== */

tiltMode.addEventListener(
  "click",
  async function(e){

    e.preventDefault();

    initAudio();


    /*
      Some iPhones require
      permission from a button
      click.
    */

    if(
      typeof DeviceOrientationEvent !==
      "undefined" &&

      typeof DeviceOrientationEvent
        .requestPermission ===
        "function"
    ){

      try{

        const permission =
          await DeviceOrientationEvent
            .requestPermission();

        if(permission!=="granted"){

          state.control="buttons";

          applyControlUI();

          help.innerHTML =
            "Tilt permission denied.<br>" +
            "Using Buttons.";

          return;
        }

      }catch(error){

        state.control="buttons";

        applyControlUI();

        help.innerHTML =
          "Tilt unavailable.<br>" +
          "Using Buttons.";

        return;
      }
    }


    state.control="tilt";

    applyControlUI();

  }
);


/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

  if(!state.running)
    return;

  if(state.paused){

    resumeGame();

  }else{

    pauseGame();
  }
}


function pauseGame(){

  if(
    !state.running ||
    state.paused
  ){
    return;
  }

  initAudio();

  state.paused=true;

  pauseSound();

  title.textContent="PAUSED";

  message.innerHTML =
    state.control==="tilt"
      ? "Tilt phone left/right to move"
      : "Use ◀ and ▶ to move";

  mainBtn.textContent="Resume";

  overlay.style.display="flex";
}


function resumeGame(){

  if(
    !state.running ||
    !state.paused
  ){
    return;
  }

  initAudio();

  state.paused=false;

  state.lastTime =
    performance.now();

  resumeSound();

  overlay.style.display="none";
}


/* =====================================================
   TRAFFIC HELPERS
===================================================== */


/*
  Distance between two cars in
  the same lane.

  This is based on their actual
  heights, so buses/trucks do not
  overlap smaller cars.
*/

function requiredCarGap(front,back){

  return (
    front.height/2 +
    back.height/2 +
    22
  );
}


/*
  Check whether a lane has a
  traffic car close to the
  spawn area.
*/

function laneBlockedAtSpawn(lane){

  for(const car of state.cars){

    if(car.lane!==lane)
      continue;

    if(
      car.y > -260 &&
      car.y < 180
    ){
      return true;
    }
  }

  return false;
}


/*
  Check whether a lane is already
  blocked in the player's forward
  path.

  This is the important safe-lane
  system.
*/

function laneBlockedAhead(lane){

  for(const car of state.cars){

    if(car.lane!==lane)
      continue;

    if(
      car.y > 80 &&
      car.y <
      player.y - 90
    ){
      return true;
    }
  }

  return false;
}


/*
  Count lanes blocked ahead.
*/

function countBlockedLanes(){

  let count=0;

  for(
    let lane=0;
    lane<road.lanes;
    lane++
  ){

    if(
      laneBlockedAhead(lane)
    ){
      count++;
    }
  }

  return count;
}


/* =====================================================
   CREATE TRAFFIC
===================================================== */

function createTraffic(){

  /*
    Find safe lanes for spawning.
  */

  let possibleLanes=[];

  for(
    let lane=0;
    lane<road.lanes;
    lane++
  ){

    if(
      !laneBlockedAtSpawn(lane)
    ){

      possibleLanes.push(lane);
    }
  }


  /*
    If every lane is occupied
    near the spawn area, wait.
  */

  if(
    possibleLanes.length===0
  ){

    return false;
  }


  /*
    Prevent a new car from
    removing the final safe lane.
  */

  const safeBefore =
    road.lanes -
    countBlockedLanes();


  if(safeBefore<=1){

    /*
      There is already only one
      safe lane. Do not add another
      dangerous lane.
    */

    return false;
  }


  /*
    Choose a random safe lane.
  */

  const lane =
    possibleLanes[
      Math.floor(
        Math.random() *
        possibleLanes.length
      )
    ];


  /*
    Pick vehicle type.
  */

  const type =
    trafficTypes[
      Math.floor(
        Math.random() *
        trafficTypes.length
      )
    ];


  const car={

    type:type.name,

    lane:lane,

    x:road.lanesX[lane],

    /*
      y is the TOP of the car.
    */

    y:-type.h-45,

    width:type.w,

    height:type.h,

    speed:
      type.speed *
      (
        .92 +
        Math.random()*.08
      ),

    nearMiss:false
  };


  state.cars.push(car);

  return true;
}


/* =====================================================
   SPAWN TRAFFIC
===================================================== */

function spawnCars(dt){

  state.spawnTimer-=dt;

  if(state.spawnTimer>0)
    return;


  /*
    Difficulty increases slowly.
  */

  const difficulty =
    Math.min(
      state.score/2500,
      .25
    );


  const spawned =
    createTraffic();


  /*
    If traffic could not safely
    spawn, check again soon.
  */

  if(spawned){

    state.spawnTimer =
      Math.max(
        .72,
        1.20-difficulty
      );

  }else{

    state.spawnTimer=.28;
  }
}


/* =====================================================
   KEEP SAME-LANE CARS APART
===================================================== */

function preventTrafficOverlap(){

  /*
    Group cars by lane.
  */

  for(
    let lane=0;
    lane<road.lanes;
    lane++
  ){

    const laneCars =
      state.cars
        .filter(
          car => car.lane===lane
        )
        .sort(
          (a,b)=>a.y-b.y
        );


    /*
      Cars are sorted from
      front/top to back/bottom.
    */

    for(
      let i=1;
      i<laneCars.length;
      i++
    ){

      const front =
        laneCars[i-1];

      const back =
        laneCars[i];


      const minGap =
        requiredCarGap(
          front,
          back
        );


      const actualGap =
        back.y -
        (
          front.y +
          front.height
        );


      /*
        If cars are overlapping
        or too close, separate them.
      */

      if(actualGap<22){

        back.y =
          front.y +
          front.height +
          22;
      }


      /*
        A faster vehicle must not
        drive through a slower
        vehicle ahead.
      */

      if(
        back.speed >
        front.speed
      ){

        back.speed =
          front.speed;
      }


      /*
        Final safety correction
        using center-distance logic.
      */

      const centerGap =
        back.y -
        front.y;

      if(
        centerGap <
        minGap
      ){

        back.y =
          front.y +
          minGap;
      }
    }
  }
}


/* =====================================================
   UPDATE TRAFFIC
===================================================== */

function updateCars(dt){

  for(
    let i=state.cars.length-1;
    i>=0;
    i--
  ){

    const car =
      state.cars[i];


    /*
      Safety against invalid
      values.
    */

    if(
      !Number.isFinite(car.y)
    ){

      car.y =
        -car.height-45;
    }


    if(
      !Number.isFinite(car.speed) ||
      car.speed<=0
    ){

      const type =
        trafficTypes.find(
          t => t.name===car.type
        );

      car.speed =
        type
          ? type.speed
          : 150;
    }


    /*
      Move car.
    */

    car.y +=
      car.speed *
      state.speedMultiplier *
      dt;


    /*
      Near miss.
    */

    if(
      !car.nearMiss &&

      car.y >
        player.y -
        30 &&

      car.y <
        player.y +
        player.height +
        30
    ){

      const horizontal =
        Math.abs(
          car.x-player.x
        );

      const safeDistance =
        (
          car.width +
          player.width
        )/2;


      if(
        horizontal >
          safeDistance &&

        horizontal <
          safeDistance+25
      ){

        car.nearMiss=true;

        state.score+=15;

        state.nearMissTimer=.7;

        beep(
          1000,
          .08,
          "square",
          .035
        );
      }
    }


    /*
      Remove when below screen.
    */

    if(
      car.y >
      canvas.height+car.height+40
    ){

      state.cars.splice(i,1);

      state.score+=5;
    }
  }


  /*
    VERY IMPORTANT:
    fix traffic separation
    after movement.
  */

  preventTrafficOverlap();
}


/* =====================================================
   COLLISION
===================================================== */

function checkCollisions(){

  if(state.invulnerable>0)
    return;


  for(
    const car of state.cars
  ){

    /*
      Player rectangle.
    */

    const playerLeft =
      player.x -
      player.width/2;

    const playerRight =
      player.x +
      player.width/2;

    const playerTop =
      player.y;

    const playerBottom =
      player.y +
      player.height;


    const carLeft =
      car.x -
      car.width/2;

    const carRight =
      car.x +
      car.width/2;

    const carTop =
      car.y;

    const carBottom =
      car.y +
      car.height;


    if(

      playerLeft < carRight &&

      playerRight > carLeft &&

      playerTop < carBottom &&

      playerBottom > carTop

    ){

      crashPlayer();

      return;
    }
  }
}


/* =====================================================
   CRASH PLAYER
===================================================== */

function crashPlayer(){

  state.lives--;

  state.invulnerable=1.5;

  state.flash=.35;

  crashSound();


  /*
    Clear nearby traffic after
    crash so player is not hit
    immediately again.
  */

  state.cars=[];


  if(state.lives<=0){

    gameOver();

    return;
  }


  /*
    Return player to center lane.
  */

  player.lane=1;

  player.x =
    road.lanesX[1];


  updateHUD();
}


/* =====================================================
   ITEMS
===================================================== */

function createItem(){

  const types=[
    "coin",
    "fuel",
    "slow"
  ];


  const type =
    types[
      Math.floor(
        Math.random()*
        types.length
      )
    ];


  const lane =
    Math.floor(
      Math.random()*
      road.lanes
    );


  state.items.push({

    type:type,

    lane:lane,

    x:road.lanesX[lane],

    y:-35,

    size:22,

    speed:
      125+
      Math.random()*30

  });
}


function spawnItems(dt){

  state.itemTimer-=dt;

  if(state.itemTimer<=0){

    createItem();

    state.itemTimer =
      2+
      Math.random()*2.5;
  }
}


/* =========================
   END PART 2
========================= */
/* =====================================================
   PART 3 - ITEMS + DRAWING
===================================================== */


/* =====================================================
   UPDATE ITEMS
===================================================== */

function updateItems(dt){

  for(
    let i=state.items.length-1;
    i>=0;
    i--
  ){

    const item =
      state.items[i];


    item.y +=
      item.speed *
      state.speedMultiplier *
      dt;


    if(
      item.y >
      canvas.height+50
    ){

      state.items.splice(i,1);

      continue;
    }


    /*
      Item collision.
    */

    const dx =
      Math.abs(
        player.x-item.x
      );


    const playerCenter =
      player.y+
      player.height/2;


    const dy =
      Math.abs(
        playerCenter-item.y
      );


    if(

      dx <
      player.width/2+
      item.size/2 &&

      dy <
      player.height/2+
      item.size/2

    ){

      collectItem(item);

      state.items.splice(i,1);
    }
  }
}


/* =====================================================
   COLLECT ITEM
===================================================== */

function collectItem(item){

  if(item.type==="coin"){

    state.coins++;

    state.score+=25;

    coinSound();

  }

  else if(item.type==="fuel"){

    state.fuel+=25;

    if(state.fuel>100)
      state.fuel=100;

    state.score+=10;

    fuelSound();

  }

  else if(item.type==="slow"){

    state.speedMultiplier=.55;

    state.slowTimer=5;

    state.score+=15;

    slowSound();
  }

  updateHUD();
}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(){

  if(
    !Array.isArray(
      road.lanesX
    ) ||
    road.lanesX.length!==3
  ){

    buildRoad();
  }


  if(
    player.lane<0
  ){
    player.lane=0;
  }


  if(
    player.lane>
    road.lanes-1
  ){

    player.lane=
      road.lanes-1;
  }


  player.x =
    road.lanesX[
      player.lane
    ];
}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

  /*
    Grass
  */

  ctx.fillStyle="#217a32";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Small grass details.
  */

  ctx.fillStyle="#1d6d2c";

  for(
    let y=-20;
    y<canvas.height;
    y+=55
  ){

    ctx.fillRect(
      8,
      y+road.offset*.2,
      10,
      3
    );

    ctx.fillRect(
      canvas.width-18,
      y+20+road.offset*.2,
      10,
      3
    );
  }


  /*
    Road.
  */

  ctx.fillStyle="#303030";

  ctx.fillRect(
    road.x,
    0,
    road.width,
    canvas.height
  );


  /*
    Road edges.
  */

  ctx.fillStyle="#eeeeee";

  ctx.fillRect(
    road.x,
    0,
    5,
    canvas.height
  );

  ctx.fillRect(
    road.x+
    road.width-
    5,
    0,
    5,
    canvas.height
  );


  /*
    Lane markings.
  */

  ctx.fillStyle="#ffffff";

  const dashHeight=45;

  const gap=35;

  const total=
    dashHeight+gap;


  const offset =
    Number.isFinite(
      road.offset
    )
      ? road.offset
      : 0;


  for(
    let i=1;
    i<road.lanes;
    i++
  ){

    const x =
      road.x+
      (
        road.width/
        road.lanes
      )*i;


    for(
      let y=
        -dashHeight+
        offset;

      y<canvas.height;

      y+=total
    ){

      ctx.fillRect(
        x-3,
        y,
        6,
        dashHeight
      );
    }
  }
}


/* =====================================================
   DRAW TRAFFIC
===================================================== */

function drawCar(car){

  const x=car.x;
  const y=car.y;
  const w=car.width;
  const h=car.height;


  ctx.save();

  ctx.translate(
    x,
    y
  );


  /*
    Vehicle colour.
  */

  if(car.type==="taxi"){

    ctx.fillStyle="#f4c542";

  }else if(car.type==="truck"){

    ctx.fillStyle="#3d7eff";

  }else if(car.type==="bus"){

    ctx.fillStyle="#e65b5b";

  }else{

    ctx.fillStyle="#e53935";
  }


  /*
    Body.
  */

  ctx.fillRect(
    -w/2,
    0,
    w,
    h
  );


  /*
    Windows.
  */

  ctx.fillStyle="#b9e6ff";


  if(car.type==="bus"){

    ctx.fillRect(
      -w/2+6,
      8,
      w-12,
      18
    );

    ctx.fillRect(
      -w/2+6,
      32,
      w-12,
      18
    );

    if(h>70){

      ctx.fillRect(
        -w/2+6,
        56,
        w-12,
        18
      );
    }

  }else{

    ctx.fillRect(
      -w/2+7,
      10,
      w-14,
      22
    );
  }


  /*
    Wheels.
  */

  ctx.fillStyle="#111";


  ctx.fillRect(
    -w/2-3,
    12,
    6,
    18
  );

  ctx.fillRect(
    w/2-3,
    12,
    6,
    18
  );

  ctx.fillRect(
    -w/2-3,
    h-30,
    6,
    18
  );

  ctx.fillRect(
    w/2-3,
    h-30,
    6,
    18
  );


  /*
    Lights.
  */

  ctx.fillStyle="#fff6a0";


  ctx.fillRect(
    -w/2+5,
    2,
    8,
    5
  );

  ctx.fillRect(
    w/2-13,
    2,
    8,
    5
  );


  /*
    Truck rear/cargo detail.
  */

  if(car.type==="truck"){

    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=2;

    ctx.strokeRect(
      -w/2+5,
      h-48,
      w-10,
      20
    );
  }


  /*
    Bus line detail.
  */

  if(car.type==="bus"){

    ctx.fillStyle=
      "rgba(255,255,255,.35)";

    ctx.fillRect(
      -w/2+5,
      h-25,
      w-10,
      4
    );
  }


  ctx.restore();
}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(){

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );


  /*
    Flash after crash.
  */

  if(
    state.invulnerable>0 &&
    Math.floor(
      state.invulnerable*10
    )%2===0
  ){

    ctx.globalAlpha=.35;
  }


  /*
    Body.
  */

  ctx.fillStyle="#00bfff";

  ctx.fillRect(
    -player.width/2,
    0,
    player.width,
    player.height
  );


  /*
    Roof.
  */

  ctx.fillStyle="#0b4f8a";

  ctx.fillRect(
    -16,
    13,
    32,
    32
  );


  /*
    Window.
  */

  ctx.fillStyle="#bdeaff";

  ctx.fillRect(
    -13,
    17,
    26,
    18
  );


  /*
    Wheels.
  */

  ctx.fillStyle="#111";

  ctx.fillRect(
    -player.width/2-3,
    12,
    6,
    20
  );

  ctx.fillRect(
    player.width/2-3,
    12,
    6,
    20
  );

  ctx.fillRect(
    -player.width/2-3,
    player.height-32,
    6,
    20
  );

  ctx.fillRect(
    player.width/2-3,
    player.height-32,
    6,
    20
  );


  /*
    Head lights.
  */

  ctx.fillStyle="#ffffaa";

  ctx.fillRect(
    -15,
    2,
    9,
    6
  );

  ctx.fillRect(
    6,
    2,
    9,
    6
  );


  /*
    Player center stripe.
  */

  ctx.fillStyle=
    "rgba(255,255,255,.25)";

  ctx.fillRect(
    -2,
    46,
    4,
    25
  );


  ctx.restore();
}


/* =====================================================
   DRAW ITEM
===================================================== */

function drawItem(item){

  ctx.save();

  ctx.translate(
    item.x,
    item.y
  );


  /* COIN */

  if(item.type==="coin"){

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      item.size/2,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#ffd700";

    ctx.fill();

    ctx.strokeStyle="#fff2a0";

    ctx.lineWidth=3;

    ctx.stroke();

    ctx.fillStyle="#9b6b00";

    ctx.font=
      "bold 15px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "$",
      0,
      1
    );
  }


  /* FUEL */

  else if(item.type==="fuel"){

    ctx.fillStyle="#ff7b00";

    ctx.fillRect(
      -10,
      -14,
      20,
      28
    );

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
      -6,
      -8,
      12,
      10
    );

    ctx.fillStyle="#ff3333";

    ctx.fillRect(
      10,
      -8,
      8,
      5
    );
  }


  /* SPEED REDUCER */

  else if(item.type==="slow"){

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      14,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#9b59ff";

    ctx.fill();

    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=2;

    ctx.stroke();

    ctx.fillStyle="#ffffff";

    ctx.font=
      "bold 13px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
      "S",
      0,
      1
    );
  }


  ctx.restore();
}


/* =====================================================
   DRAW TRAFFIC + ITEMS
===================================================== */

function drawTraffic(){

  for(
    const car of state.cars
  ){

    drawCar(car);
  }
}


function drawItems(){

  for(
    const item of state.items
  ){

    drawItem(item);
  }
}


/* =========================
   END PART 3
========================= */
/* =====================================================
   PART 4 - TILT + DRAW + GAME LOOP
===================================================== */


/* =====================================================
   TILT CONTROL
===================================================== */

function handleTilt(event){

  if(
    !state.running ||
    state.paused ||
    state.control!=="tilt"
  ){
    return;
  }


  if(
    state.tiltCooldown>0
  ){
    return;
  }


  /*
    gamma:
    negative = phone tilted left
    positive = phone tilted right
  */

  const gamma =
    Number(event.gamma)||0;


  /*
    Strong left tilt.
  */

  if(gamma < -12){

    moveLeft();

    state.tiltCooldown=.30;
  }


  /*
    Strong right tilt.
  */

  else if(gamma > 12){

    moveRight();

    state.tiltCooldown=.30;
  }
}


window.addEventListener(
  "deviceorientation",
  handleTilt,
  {passive:true}
);


/* =====================================================
   CENTER TAP = PAUSE
===================================================== */

canvas.addEventListener(
  "pointerdown",
  function(e){

    if(
      !state.running ||
      state.paused
    ){
      return;
    }


    /*
      Do not pause when tapping
      near the bottom controls.
    */

    const rect =
      canvas.getBoundingClientRect();


    const x =
      (
        e.clientX-
        rect.left
      ) *
      (
        canvas.width/
        rect.width
      );


    const y =
      (
        e.clientY-
        rect.top
      ) *
      (
        canvas.height/
        rect.height
      );


    const centerWidth =
      canvas.width*.45;

    const centerHeight =
      canvas.height*.35;


    const left =
      (
        canvas.width-
        centerWidth
      )/2;


    const top =
      (
        canvas.height-
        centerHeight
      )/2;


    if(

      x>=left &&

      x<=left+centerWidth &&

      y>=top &&

      y<=top+centerHeight

    ){

      pauseGame();
    }

  },
  {passive:true}
);


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Background.
  */

  drawBackground();


  /*
    Items behind traffic.
  */

  drawItems();


  /*
    Traffic.
  */

  drawTraffic();


  /*
    Player.
  */

  drawPlayer();


  /*
    SPEED REDUCER EFFECT
  */

  if(
    state.slowTimer>0
  ){

    ctx.fillStyle=
      "rgba(155,89,255,.10)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle="#fff";

    ctx.font=
      "bold 16px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "SLOW MODE",
      canvas.width/2,
      80
    );
  }


  /*
    NEAR MISS
  */

  if(
    state.nearMissTimer>0
  ){

    ctx.fillStyle="#ffe600";

    ctx.font=
      "bold 20px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "NICE!",
      canvas.width/2,
      120
    );
  }


  /*
    CRASH FLASH
  */

  if(
    state.flash>0
  ){

    ctx.fillStyle=
      "rgba(255,0,0,.18)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }


  /*
    PAUSE SCREEN.
  */

  if(state.paused){

    ctx.fillStyle=
      "rgba(0,0,0,.35)";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    ctx.fillStyle="#fff";

    ctx.font=
      "bold 28px Arial";

    ctx.textAlign="center";

    ctx.fillText(
      "PAUSED",
      canvas.width/2,
      canvas.height/2-35
    );


    ctx.font="16px Arial";

    ctx.fillText(
      "Tap Resume to continue",
      canvas.width/2,
      canvas.height/2+5
    );


    ctx.font="14px Arial";

    ctx.fillText(
      state.control==="tilt"
        ? "Tilt phone to move"
        : "Use ◀ and ▶ buttons",
      canvas.width/2,
      canvas.height/2+32
    );
  }
}


/* =====================================================
   MAIN GAME LOOP
===================================================== */

function animate(timestamp){

  if(!state.lastTime){

    state.lastTime=
      timestamp;
  }


  let dt=
    (
      timestamp-
      state.lastTime
    )/1000;


  state.lastTime=
    timestamp;


  if(
    !Number.isFinite(dt)
  ){

    dt=0;
  }


  /*
    Prevent huge movement
    after switching tabs.
  */

  if(dt>.05){

    dt=.05;
  }


  /*
    Prevent invalid values.
  */

  if(
    !Number.isFinite(
      state.score
    )
  ){

    state.score=0;
  }


  if(
    !Number.isFinite(
      state.fuel
    )
  ){

    state.fuel=100;
  }


  /* =================================================
     GAME UPDATE
  ================================================= */

  if(
    state.running &&
    !state.paused
  ){

    /*
      Fuel decreases slowly.
    */

    state.fuel -=
      dt*1.8;


    if(state.fuel<0){

      state.fuel=0;
    }


    /*
      Slow mode timer.
    */

    if(
      state.slowTimer>0
    ){

      state.slowTimer-=dt;


      if(
        state.slowTimer<=0
      ){

        state.slowTimer=0;

        state.speedMultiplier=1;
      }
    }


    /*
      Invulnerability.
    */

    if(
      state.invulnerable>0
    ){

      state.invulnerable-=dt;
    }


    /*
      Crash flash.
    */

    if(
      state.flash>0
    ){

      state.flash-=dt;
    }


    /*
      Near miss message.
    */

    if(
      state.nearMissTimer>0
    ){

      state.nearMissTimer-=dt;
    }


    /*
      Tilt cooldown.
    */

    if(
      state.tiltCooldown>0
    ){

      state.tiltCooldown-=dt;
    }


    /*
      Moving road.
    */

    road.offset +=
      state.roadSpeed *
      state.speedMultiplier *
      dt;


    const roadDashTotal=80;


    if(
      road.offset>=
      roadDashTotal
    ){

      road.offset -=
        roadDashTotal;
    }


    /*
      Score.
    */

    state.score +=
      dt*
      5*
      state.speedMultiplier;


    /*
      GAME OBJECTS.
    */

    spawnCars(dt);

    spawnItems(dt);

    updateCars(dt);

    updateItems(dt);

    updatePlayer();

    checkCollisions();


    /*
      Out of fuel.
    */

    if(
      state.fuel<=0
    ){

      state.fuel=0;

      gameOver();
    }


    updateHUD();
  }


  /*
    Always draw.
  */

  draw();


  requestAnimationFrame(
    animate
  );
}


/* =====================================================
   START GAME SYSTEM
===================================================== */

buildRoad();

resetGame();

applyControlUI();

updateHUD();


/*
  Start animation.
*/

requestAnimationFrame(
  animate
);


/* =====================================================
   END OF ROAD RUSH
===================================================== */

</script>
